<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Центр задач</title>
<meta name="theme-color" content="#0e1422">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Задачи">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1422; --surface:#161e30; --surface2:#1d2740; --line:#26314d;
  --text:#e7ecf5; --muted:#8a96ad; --faint:#5d6984;
  --accent:#6c8cff; --accent2:#4f6fe8; --red:#ff6b6b; --amber:#f5b84c; --green:#4cc38a; --violet:#a78bfa;
  --r:14px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{min-height:100dvh;overscroll-behavior-y:contain}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:680px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 96px)}

.hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.hdr .back{width:36px;height:36px;border-radius:10px;background:var(--surface);display:grid;place-items:center;flex:none}
.hdr h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .sub{font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--muted)}
.icon-btn:active{background:var(--surface2)}
.icon-btn svg,.back svg{width:20px;height:20px}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;margin-right:6px;vertical-align:middle}
.sync-dot.on{background:var(--green)} .sync-dot.err{background:var(--red)}

.quick{display:flex;gap:8px;margin-bottom:18px}
.quick input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;outline:none}
.quick input:focus{border-color:var(--accent)}
.quick button{background:var(--accent);color:#fff;border-radius:var(--r);padding:0 16px;font-weight:700}

.sec{margin:20px 0 8px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sec .n{background:var(--surface2);color:var(--muted);border-radius:20px;padding:1px 8px;font-size:12px;letter-spacing:0}
.sec.red{color:var(--red)} .sec.amber{color:var(--amber)} .sec.accent{color:var(--accent)}
.sec .toggle{margin-left:auto;font-size:12px;text-transform:none;letter-spacing:0;color:var(--faint)}
.list{display:flex;flex-direction:column;gap:6px}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:var(--r);padding:12px 14px;border-left:3px solid transparent;transition:opacity .2s}
.task.p1{border-left-color:var(--red)} .task.p3{opacity:.85}
.task.done{opacity:.5} .task.done .ttl{text-decoration:line-through;color:var(--muted)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--faint);flex:none;margin-top:1px;display:grid;place-items:center}
.task.p1 .chk{border-color:var(--red)}
.task.done .chk{background:var(--green);border-color:var(--green)}
.task.done .chk::after{content:"";width:6px;height:11px;border:solid #0e1422;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttl{font-weight:600;line-height:1.35;word-wrap:break-word}
.note{font-size:13px;color:var(--muted);margin-top:3px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.chip.red{color:var(--red);background:rgba(255,107,107,.12)}
.chip.amber{color:var(--amber);background:rgba(245,184,76,.12)}
.chip.accent{color:var(--accent);background:rgba(108,140,255,.14)}
.chip.violet{color:var(--violet);background:rgba(167,139,250,.14)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.empty{text-align:center;color:var(--muted);padding:36px 16px;background:var(--surface);border-radius:var(--r);font-size:15px;line-height:1.5}
.empty b{display:block;font-size:28px;margin-bottom:6px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px}
.stat .v{font-size:24px;font-weight:800} .stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat.red .v{color:var(--red)} .stat.accent .v{color:var(--accent)} .stat.green .v{color:var(--green)}

.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;outline:none;margin-bottom:14px}
.search:focus{border-color:var(--accent)}
.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.area{background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;min-height:110px}
.area::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.area .em{font-size:24px}
.area .nm{font-weight:700;font-size:16px;line-height:1.2}
.area .cnt{font-size:13px;color:var(--muted);margin-top:auto}
.area .cnt .r{color:var(--red);font-weight:700}
.area:active{background:var(--surface2)}
.bar{height:4px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}

.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,20,34,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(var(--sb) + 6px);z-index:10}
.nav-in{max-width:680px;margin:0 auto;display:flex;align-items:center}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint);padding:6px 0;position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.nav .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:0 5px;line-height:16px;min-width:16px}
.fab{width:54px;height:54px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;margin:-22px 6px 0;box-shadow:0 8px 24px rgba(108,140,255,.4);flex:none}
.fab svg{width:26px;height:26px}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:92dvh;display:flex;justify-content:center}
.sheet.show{transform:none}
.sheet-in{background:var(--surface);width:100%;max-width:680px;border-radius:22px 22px 0 0;padding:10px 18px calc(var(--sb) + 18px);overflow-y:auto;max-height:92dvh}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 14px;font-size:20px;font-weight:800}
.sheet h3{margin:22px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fld{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;margin-bottom:10px}
.fld:focus{border-color:var(--accent)}
textarea.fld{min-height:76px;resize:vertical}
.fld.big{font-size:18px;font-weight:600}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{padding:7px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pick.on{background:rgba(108,140,255,.16);border-color:var(--accent);color:var(--text)}
.pick input[type=date]{background:none;border:0;outline:none;color:inherit;font-size:14px;width:130px;padding:0}
.pick input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7)}
.row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:700;background:var(--surface2);text-align:center}
.btn.pri{background:var(--accent);color:#fff}
.btn.danger{color:var(--red);flex:0 0 auto;padding:14px 18px}
.btn.sm{flex:0 0 auto;padding:10px 14px;font-size:14px}
.btn:disabled{opacity:.5}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:6px 0 10px}
.hint code{background:var(--bg);padding:1px 6px;border-radius:6px;font-size:12px}
.status-box{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;display:flex;align-items:center}
.arow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.arow .fld{margin:0}
.arow .em-in{width:52px;text-align:center;padding:10px 4px;flex:none}
.arow input[type=color]{width:40px;height:42px;border:0;background:none;padding:0;flex:none}
.arow .del{width:40px;height:42px;border-radius:10px;background:var(--bg);color:var(--red);flex:none;font-size:18px}
pre.code{background:var(--bg);border-radius:12px;padding:12px;font-size:11.5px;line-height:1.45;max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 8px;color:#b9c3d9}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 90px);transform:translateX(-50%) translateY(20px);background:#26314d;color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:#4a2330}
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.6)}
.modal.show{display:flex}
.modal-in{background:var(--surface);border-radius:18px;padding:20px;max-width:360px;width:100%}
.modal-in p{margin:0 0 4px;font-weight:600;line-height:1.45}
.day-h{display:flex;align-items:baseline;gap:8px}
.day-h small{font-weight:600;color:var(--faint);text-transform:none;letter-spacing:0}
@media (min-width:560px){.areas{grid-template-columns:repeat(3,1fr)}}
.subareas{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.subarea{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r);padding:12px 14px;text-align:left;border-left:3px solid var(--c)}
.subarea .nm{font-weight:700;flex:1;min-width:0}
.subarea .cnt{font-size:13px;color:var(--muted);white-space:nowrap}
.subarea .cnt .r{color:var(--red);font-weight:700}
.subarea .go{color:var(--faint);font-size:18px}
.subarea.add{border-left-color:var(--line);color:var(--muted);justify-content:center;font-weight:600;font-size:14px}
.chip.btnchip{cursor:pointer;color:var(--accent);background:rgba(108,140,255,.14)}
.task.child{position:relative}
.task.child::before{content:"";position:absolute;left:-12px;top:0;bottom:50%;width:10px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-bottom-left-radius:8px}
.subrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.subrow .chk{width:20px;height:20px}
.subrow.done .t{text-decoration:line-through;color:var(--muted)}
.subrow .t{flex:1;cursor:pointer}
.subrow .n{font-size:12px;color:var(--muted)}
.subrow.done .chk{background:var(--green);border-color:var(--green)}
select.fld{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.parent-link{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);margin:-4px 0 12px;cursor:pointer}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="nav"><div class="nav-in" id="nav"></div></nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"><div class="sheet-in" id="sheet-in"></div></div>
<div class="modal" id="modal"><div class="modal-in" id="modal-in"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-in" accept="application/json" hidden>

<script>
'use strict';
// ================= utils =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const addDays = (s, n) => { const [y,m,d] = s.split('-').map(Number); return iso(new Date(y, m-1, d+n)); };
const diffDays = (a, b) => { const p = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d); }; return Math.round((p(a)-p(b))/864e5); };
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const WDF = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const dObj = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
function fmtDue(s){
  const n = diffDays(s, today());
  if (n === 0) return 'Сегодня';
  if (n === 1) return 'Завтра';
  if (n === -1) return 'Вчера';
  const d = dObj(s);
  const base = `${d.getDate()} ${MON[d.getMonth()]}`;
  return (n > 1 && n < 7) ? `${WD[d.getDay()]}, ${base}` : base;
}
function plural(n, a, b, c){ const m10 = n%10, m100 = n%100; return m10===1&&m100!==11 ? a : (m10>=2&&m10<=4&&(m100<10||m100>=20) ? b : c); }

const STATUS = { todo:'Сделать', doing:'В работе', waiting:'Ждёт', done:'Готово' };
const PRIO = { 1:'🔥 Высокий', 2:'Обычный', 3:'Низкий' };
const DEFAULT_AREAS = [
  ['Store 457','🏪','#6c8cff'], ['Kynne&Tech','📱','#a78bfa'], ['EV77','🚗','#4cc38a'],
  ['DioNis','🎵','#f5b84c'], ['Личное','🏠','#ff8a8a']
];

// ================= backends =================
let cfg = LS.get('tc_cfg', null);   // {url, anon, key}
const CLOUD = { url: 'https://sjxhgnssuqimehpyiflm.supabase.co', anon: 'sb_publishable_CX0K45yuIk6o0UkuLYYgBg_jMqtuA-k' };
// вход по ссылке: …/tasks/#key=XXXX (ключ сразу убирается из адреса)
(() => {
  const m = location.hash.match(/key=([0-9a-f]{32})/i);
  if (m){ cfg = { ...CLOUD, key: m[1].toLowerCase() }; LS.set('tc_cfg', cfg); history.replaceState(null, '', location.pathname); }
})();

const Local = {
  load(){
    let db = LS.get('tc_local', null);
    if (!db){
      db = { areas: DEFAULT_AREAS.map(([name,emoji,color], i) => ({ id: uid(), name, emoji, color, sort: i+1 })), tasks: [] };
      LS.set('tc_local', db);
    }
    return db;
  },
  save(db){ LS.set('tc_local', db); },
  async list(){ const db = this.load(); const cut = Date.now() - 30*864e5;
    return { areas: db.areas, tasks: db.tasks.filter(t => t.status !== 'done' || !t.done_at || Date.parse(t.done_at) > cut), today: today() }; },
  async addTask(t){ const db = this.load(); const now = new Date().toISOString();
    const par = t.parent_id ? db.tasks.find(x => x.id === t.parent_id) : null;
    const n = { id: uid(), title: t.title, notes: t.notes||'', area_id: t.area_id || (par ? par.area_id : null), parent_id: t.parent_id||null, status: t.status||'todo', priority: t.priority||2, due: t.due||null, created_at: now, updated_at: now, done_at: t.status==='done' ? now : null };
    db.tasks.push(n); this.save(db); return n; },
  async updateTask(id, p){ const db = this.load(); const t = db.tasks.find(x => x.id === id); if (!t) throw new Error('Задача не найдена');
    Object.assign(t, p, { updated_at: new Date().toISOString() });
    t.done_at = t.status === 'done' ? (t.done_at || new Date().toISOString()) : null;
    this.save(db); return t; },
  async deleteTask(id){ const db = this.load(); const kill = new Set([id]); let grow = true;
    while (grow){ grow = false; for (const t of db.tasks) if (t.parent_id && kill.has(t.parent_id) && !kill.has(t.id)){ kill.add(t.id); grow = true; } }
    db.tasks = db.tasks.filter(x => !kill.has(x.id)); this.save(db); },
  async addArea(a){ const db = this.load(); const par = a.parent_id ? db.areas.find(x => x.id === a.parent_id) : null;
    const n = { id: uid(), name: a.name, emoji: a.emoji||'📁', color: a.color || (par ? par.color : '#6c8cff'), parent_id: a.parent_id||null, sort: Math.max(0, ...db.areas.filter(x => (x.parent_id||null) === (a.parent_id||null)).map(x=>x.sort||0)) + 1 };
    db.areas.push(n); this.save(db); return n; },
  async updateArea(id, p){ const db = this.load(); const a = db.areas.find(x => x.id === id); if (a) Object.assign(a, p); this.save(db); return a; },
  async deleteArea(id){ const db = this.load(); const a = db.areas.find(x => x.id === id); const par = a ? (a.parent_id||null) : null;
    db.areas.forEach(x => { if (x.parent_id === id) x.parent_id = par; }); db.tasks.forEach(t => { if (t.area_id === id) t.area_id = par; });
    db.areas = db.areas.filter(x => x.id !== id); this.save(db); }
};

async function rpc(fn, args, c = cfg){
  const headers = { 'apikey': c.anon, 'Content-Type': 'application/json' };
  if (c.anon.startsWith('eyJ')) headers.Authorization = 'Bearer ' + c.anon;  // старый формат anon-ключа
  const r = await fetch(c.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers, body: JSON.stringify({ p_key: c.key, ...args }) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || ('Ошибка ' + r.status));
  return j;
}
const Cloud = {
  async list(){ return rpc('tm_list', { p_done_days: 30 }); },
  async addTask(t){ return rpc('tm_add_task', { p_title: t.title, p_notes: t.notes||'', p_area: t.area_id||null, p_priority: t.priority||2, p_due: t.due||null, p_status: t.status||'todo', p_parent: t.parent_id||null }); },
  async updateTask(id, p){
    const a = { p_id: id };
    if ('title' in p) a.p_title = p.title;
    if ('notes' in p) a.p_notes = p.notes;
    if ('priority' in p) a.p_priority = p.priority;
    if ('status' in p) a.p_status = p.status;
    if ('due' in p){ if (p.due) a.p_due = p.due; else a.p_clear_due = true; }
    if ('area_id' in p){ if (p.area_id) a.p_area = p.area_id; else a.p_clear_area = true; }
    if ('parent_id' in p){ if (p.parent_id) a.p_parent = p.parent_id; else a.p_clear_parent = true; }
    return rpc('tm_update_task', a);
  },
  async deleteTask(id){ return rpc('tm_delete_task', { p_id: id }); },
  async addArea(a){ return rpc('tm_add_area', { p_name: a.name, p_emoji: a.emoji||'📁', p_color: a.color||null, p_parent: a.parent_id||null }); },
  async updateArea(id, p){
    const a = { p_id: id, p_name: p.name ?? null, p_emoji: p.emoji ?? null, p_color: p.color ?? null, p_sort: p.sort ?? null };
    if ('parent_id' in p){ if (p.parent_id) a.p_parent = p.parent_id; else a.p_clear_parent = true; }
    return rpc('tm_update_area', a);
  },
  async deleteArea(id){ return rpc('tm_delete_area', { p_id: id }); }
};
const api = () => (cfg ? Cloud : Local);

// ================= state =================
const S = {
  view: LS.get('tc_view', 'today'),
  areaId: null,
  areas: [], tasks: [],
  loading: false, syncErr: null,
  showDone: {},
  expanded: new Set(LS.get('tc_exp', [])),
  q: ''
};
if (String(S.view).startsWith('area:')){ S.areaId = S.view.slice(5); S.view = 'area'; }

function cacheSave(){ if (cfg) LS.set('tc_cache', { areas: S.areas, tasks: S.tasks }); }
function areaOf(id){ return S.areas.find(a => a.id === id); }
const kidsOf = id => S.areas.filter(a => (a.parent_id||null) === (id||null)).sort((a,b) => (a.sort||0)-(b.sort||0) || a.name.localeCompare(b.name));
function areaTree(id){ const out = [id]; for (const c of kidsOf(id)) out.push(...areaTree(c.id)); return out; }
function areaChain(id){ const p = []; let a = areaOf(id), g = 0; while (a && g++ < 20){ p.unshift(a); a = areaOf(a.parent_id); } return p; }
const areaPathName = id => areaChain(id).map(a => a.name).join(' / ');
function flatAreas(parent = null, depth = 0){ return kidsOf(parent).flatMap(a => [{ a, depth }, ...flatAreas(a.id, depth + 1)]); }
const taskOf = id => S.tasks.find(t => t.id === id);
const subsOf = id => S.tasks.filter(t => t.parent_id === id);
function taskDesc(id){ const out = []; for (const c of subsOf(id)) out.push(c, ...taskDesc(c.id)); return out; }
const isTop = t => !t.parent_id || !taskOf(t.parent_id);

async function reload(silent){
  S.loading = true; if (!silent) render();
  try{
    const d = await api().list();
    S.areas = (d.areas || []).slice().sort((a,b) => (a.sort||0)-(b.sort||0));
    S.tasks = d.tasks || [];
    S.syncErr = null; cacheSave();
  }catch(e){
    S.syncErr = e.message;
    if (!silent) toast('Не удалось обновить: ' + e.message, true);
  }finally{ S.loading = false; render(); }
}

// оптимистичное изменение + запрос
async function act(localFn, remoteFn, okMsg){
  localFn(); render();
  try{ const r = await remoteFn(); if (okMsg) toast(okMsg); return r; }
  catch(e){ toast('Ошибка: ' + e.message, true); await reload(true); }
}

// ================= task ops =================
async function createTask(t){
  const tmp = { id: 'tmp-' + uid(), notes:'', status:'todo', priority:2, due:null, area_id:null, created_at:new Date().toISOString(), ...t };
  const r = await act(() => S.tasks.push(tmp), () => api().addTask(t), 'Добавлено');
  if (r){ const i = S.tasks.indexOf(tmp); if (i >= 0) S.tasks[i] = r; cacheSave(); render(); }
}
async function patchTask(id, p, msg){
  const t = S.tasks.find(x => x.id === id); if (!t || id.startsWith('tmp-')) return;
  await act(() => { Object.assign(t, p); t.done_at = t.status === 'done' ? (t.done_at || new Date().toISOString()) : null; },
            () => api().updateTask(id, p), msg);
  cacheSave();
}
async function removeTask(id){
  const kill = new Set([id, ...taskDesc(id).map(x => x.id)]);
  await act(() => { S.tasks = S.tasks.filter(x => !kill.has(x.id)); }, () => api().deleteTask(id), 'Удалено');
  cacheSave();
}
function toggleDone(id){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  if (navigator.vibrate) navigator.vibrate(10);
  patchTask(id, { status: t.status === 'done' ? 'todo' : 'done' });
}

// ================= rendering =================
const open = t => t.status !== 'done';
const isOver = t => open(t) && t.due && t.due < today();
const sortTasks = arr => arr.slice().sort((a,b) =>
  (a.status==='done') - (b.status==='done') ||
  (a.priority||2) - (b.priority||2) ||
  ((a.due||'9999') < (b.due||'9999') ? -1 : (a.due||'9999') > (b.due||'9999') ? 1 : 0) ||
  String(a.created_at||'').localeCompare(String(b.created_at||'')));

function taskRow(t, opts = {}, depth = 0){
  const a = areaOf(t.area_id);
  const chips = [];
  const subs = subsOf(t.id);
  if (subs.length && !opts.flat){
    const dn = subs.filter(x => x.status === 'done').length;
    const exp = S.expanded.has(t.id);
    chips.push(`<span class="chip btnchip" data-act="expand">${exp ? '▾' : '▸'} ${dn}/${subs.length}</span>`);
  } else if (subs.length) chips.push(`<span class="chip">☰ ${subs.filter(x => x.status === 'done').length}/${subs.length}</span>`);
  if (opts.flat && t.parent_id && taskOf(t.parent_id)) chips.push(`<span class="chip">↳ ${esc(taskOf(t.parent_id).title)}</span>`);
  if (a && !opts.hideArea && depth === 0) chips.push(`<span class="chip"><span class="dot" style="background:${esc(a.color)}"></span>${esc(areaPathName(a.id))}</span>`);
  if (!a && !opts.hideArea && depth === 0 && t.area_id == null) chips.push(`<span class="chip">📥 Входящие</span>`);
  if (t.due && !opts.hideDue){
    const cls = isOver(t) ? 'red' : (t.due === today() ? 'accent' : '');
    chips.push(`<span class="chip ${cls}">${isOver(t) ? '⏰ ' : ''}${fmtDue(t.due)}</span>`);
  }
  if (t.status === 'doing') chips.push(`<span class="chip violet">▶ В работе</span>`);
  if (t.status === 'waiting') chips.push(`<span class="chip amber">⏳ Ждёт</span>`);
  if (t.priority === 1 && t.status !== 'done') chips.push(`<span class="chip red">🔥</span>`);
  let h = `<div class="task p${t.priority||2} ${t.status==='done'?'done':''} ${depth ? 'child' : ''}" data-id="${esc(t.id)}" style="${depth ? `margin-left:${Math.min(depth, 5) * 20}px` : ''}">
    <button class="chk" data-act="toggle" aria-label="Готово"></button>
    <div class="tbody" data-act="edit">
      <div class="ttl">${esc(t.title)}</div>
      ${t.notes ? `<div class="note">${esc(t.notes)}</div>` : ''}
      ${chips.length ? `<div class="meta">${chips.join('')}</div>` : ''}
    </div></div>`;
  if (subs.length && !opts.flat && S.expanded.has(t.id))
    h += sortTasks(subs).map(c => taskRow(c, { ...opts, hideArea: true }, depth + 1)).join('');
  return h;
}
function section(title, tasks, opts = {}){
  if (!tasks.length && !opts.keep) return '';
  return `<div class="sec ${opts.cls||''}">${title}<span class="n">${tasks.length}</span>${opts.extra||''}</div>
    <div class="list">${tasks.map(t => taskRow(t, opts)).join('')}</div>`;
}
function doneSection(key, tasks, opts = {}){
  if (!tasks.length) return '';
  const on = S.showDone[key];
  return `<div class="sec">Готово<span class="n">${tasks.length}</span><button class="toggle" data-act="show-done" data-k="${key}">${on ? 'скрыть' : 'показать'}</button></div>
    ${on ? `<div class="list">${tasks.map(t => taskRow(t, opts)).join('')}</div>` : ''}`;
}
function header(title, sub, back, extra = ''){
  const dot = cfg ? (S.syncErr ? 'err' : 'on') : '';
  const backBtn = !back ? '' : back === 'areas'
    ? `<button class="back" data-act="go" data-v="areas">${I.back}</button>`
    : `<button class="back" data-act="open-area" data-v="${esc(back)}">${I.back}</button>`;
  return `<div class="hdr">
    ${backBtn}
    <div style="flex:1;min-width:0"><h1>${title}</h1><div class="sub"><span class="sync-dot ${dot}"></span>${sub}</div></div>
    ${extra}
    <button class="icon-btn ${S.loading?'spin':''}" data-act="refresh" aria-label="Обновить">${I.refresh}</button>
    <button class="icon-btn" data-act="settings" aria-label="Настройки">${I.gear}</button>
  </div>`;
}
function quickAdd(ph){ return `<form class="quick" data-form="quick"><input name="q" placeholder="${ph}" autocomplete="off" enterkeyhint="done"><button type="submit">+</button></form>`; }
function areaStats(id){
  const ids = new Set(areaTree(id));
  const ts = S.tasks.filter(t => ids.has(t.area_id));
  return { all: ts.length, open: ts.filter(open).length, over: ts.filter(isOver).length };
}

function viewToday(){
  const td = today(), d = new Date();
  const over = sortTasks(S.tasks.filter(isOver));
  const tod  = sortTasks(S.tasks.filter(t => open(t) && t.due === td));
  const doing = sortTasks(S.tasks.filter(t => open(t) && t.status === 'doing' && !(t.due && t.due <= td)));
  const hot  = sortTasks(S.tasks.filter(t => open(t) && t.priority === 1 && !t.due && t.status !== 'doing'));
  const doneToday = S.tasks.filter(t => t.status === 'done' && t.done_at && iso(new Date(t.done_at)) === td);
  const openAll = S.tasks.filter(open).length;
  let h = header('Сегодня', `${WDF[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`);
  h += `<div class="stats">
    <div class="stat red"><div class="v">${over.length}</div><div class="l">просрочено</div></div>
    <div class="stat accent"><div class="v">${tod.length}</div><div class="l">на сегодня</div></div>
    <div class="stat green"><div class="v">${doneToday.length}</div><div class="l">сделано</div></div></div>`;
  h += section('🔥 Горит', over, { cls: 'red', flat: true });
  h += section('Сегодня', tod, { cls: 'accent', hideDue: true, flat: true });
  h += section('В работе', doing, { flat: true });
  h += section('Важное без срока', hot, { flat: true });
  if (!over.length && !tod.length && !doing.length && !hot.length)
    h += `<div class="empty" style="margin-top:16px"><b>☀️</b>На сегодня ничего не горит.<br>Всего открытых задач: ${openAll}</div>`;
  h += doneSection('today', doneToday, { flat: true });
  return h;
}

function viewAreas(){
  const nOpen = S.tasks.filter(open).length;
  let h = header('Полки', `${nOpen} ${plural(nOpen,'открытая задача','открытые задачи','открытых задач')}`);
  h += `<input class="search" id="search" placeholder="🔍 Поиск по всем задачам" value="${esc(S.q)}" autocomplete="off">`;
  if (S.q.trim()){
    const q = S.q.trim().toLowerCase();
    const res = sortTasks(S.tasks.filter(t => (t.title + ' ' + (t.notes||'')).toLowerCase().includes(q)));
    return h + (res.length ? section('Найдено', res, { flat: true }) : `<div class="empty">Ничего не найдено</div>`);
  }
  const inboxN = S.tasks.filter(t => open(t) && !t.area_id).length;
  h += `<div class="areas">`;
  for (const a of kidsOf(null)){
    const st = areaStats(a.id), nk = areaTree(a.id).length - 1;
    const pct = st.all ? Math.round((st.all - st.open) / st.all * 100) : 0;
    h += `<button class="area" style="--c:${esc(a.color)}" data-act="open-area" data-v="${esc(a.id)}">
      <div class="em">${esc(a.emoji)}</div><div class="nm">${esc(a.name)}</div>
      <div class="cnt">${st.open} ${plural(st.open,'задача','задачи','задач')}${nk ? ` · ${nk} ${plural(nk,'полка','полки','полок')}` : ''}${st.over ? ` · <span class="r">${st.over} горит</span>` : ''}</div>
      <div class="bar"><i style="width:${pct}%"></i></div></button>`;
  }
  h += `<button class="area" style="--c:var(--faint)" data-act="go" data-v="inbox"><div class="em">📥</div><div class="nm">Входящие</div><div class="cnt">${inboxN} ${plural(inboxN,'задача','задачи','задач')}</div></button>`;
  h += `<button class="area" style="--c:var(--line);align-items:center;justify-content:center;color:var(--muted)" data-act="new-area"><div class="em">＋</div><div class="nm" style="font-size:14px">Новая полка</div></button>`;
  return h + `</div>`;
}

function viewArea(){
  const a = areaOf(S.areaId);
  if (!a){ S.view = 'areas'; return viewAreas(); }
  const chain = areaChain(a.id);
  const parent = chain.length > 1 ? chain[chain.length - 2] : null;
  const ts = S.tasks.filter(t => t.area_id === a.id);
  const top = ts.filter(isTop);
  const op = top.filter(open);
  const st = areaStats(a.id);
  const crumbs = chain.slice(0, -1).map(x => esc(x.name)).join(' › ');
  const sub = `${crumbs ? crumbs + ' › ' : ''}${st.open} ${plural(st.open,'открытая','открытые','открытых')}${st.over ? ` · ${st.over} горит` : ''}`;
  const editBtn = `<button class="icon-btn" data-act="edit-area" data-v="${esc(a.id)}" aria-label="Изменить полку">✎</button>`;
  let h = header(`${esc(a.emoji)} ${esc(a.name)}`, sub, parent ? parent.id : 'areas', editBtn);
  h += quickAdd(`Добавить в «${esc(a.name)}»…`);
  const kids = kidsOf(a.id);
  h += `<div class="sec">Полки внутри<span class="n">${kids.length}</span></div><div class="subareas">`;
  for (const k of kids){
    const ks = areaStats(k.id), nk = areaTree(k.id).length - 1;
    h += `<button class="subarea" style="--c:${esc(k.color)}" data-act="open-area" data-v="${esc(k.id)}">
      <span>${esc(k.emoji)}</span><span class="nm">${esc(k.name)}</span>
      <span class="cnt">${ks.open}${nk ? ` · ${nk} 🗂` : ''}${ks.over ? ` · <span class="r">${ks.over}🔥</span>` : ''}</span><span class="go">›</span></button>`;
  }
  h += `<button class="subarea add" data-act="new-area" data-v="${esc(a.id)}">＋ Полка внутри «${esc(a.name)}»</button></div>`;
  h += section('В работе', sortTasks(op.filter(t => t.status === 'doing')), { hideArea: true, cls: 'accent' });
  h += section('Сделать', sortTasks(op.filter(t => t.status === 'todo')), { hideArea: true });
  h += section('Ждёт', sortTasks(op.filter(t => t.status === 'waiting')), { hideArea: true, cls: 'amber' });
  if (!op.length && !kids.length) h += `<div class="empty"><b>✨</b>На этой полке пусто</div>`;
  h += doneSection('a' + a.id, sortTasks(top.filter(t => !open(t))), { hideArea: true });
  return h;
}

function viewInbox(){
  const ts = S.tasks.filter(t => !t.area_id && isTop(t));
  const op = sortTasks(ts.filter(open));
  let h = header('Входящие', 'Всё, что пришло в голову');
  h += quickAdd('Что пришло в голову?');
  h += op.length ? `<div class="list">${op.map(t => taskRow(t, { hideArea: true })).join('')}</div>`
                 : `<div class="empty"><b>📭</b>Входящие пусты.<br>Разложи задачи по полкам — нажми на задачу и выбери полку.</div>`;
  h += doneSection('inbox', ts.filter(t => !open(t)), { hideArea: true });
  return h;
}

function viewPlan(){
  const td = today();
  const op = S.tasks.filter(open);
  let h = header('План', 'Ближайшие 2 недели');
  const over = sortTasks(op.filter(isOver));
  h += section('Просрочено', over, { cls: 'red', flat: true });
  for (let i = 0; i < 14; i++){
    const day = addDays(td, i);
    const ts = sortTasks(op.filter(t => t.due === day));
    if (!ts.length && i > 2) continue;
    const d = dObj(day);
    const title = `<span class="day-h">${i===0?'Сегодня':i===1?'Завтра':WDF[d.getDay()]}<small>${d.getDate()} ${MON[d.getMonth()]}</small></span>`;
    h += section(title, ts, { hideDue: true, keep: true, cls: i===0 ? 'accent' : '', flat: true });
    if (!ts.length) h += `<div class="hint" style="padding-left:4px">— свободно</div>`;
  }
  const later = sortTasks(op.filter(t => t.due && t.due > addDays(td, 13)));
  h += section('Позже', later, { flat: true });
  const none = sortTasks(op.filter(t => !t.due));
  h += section('Без срока', none.filter(isTop), { cls: '' });
  return h;
}

function renderNav(){
  const over = S.tasks.filter(isOver).length;
  const inboxN = S.tasks.filter(t => open(t) && !t.area_id).length;
  const b = (v, ic, label, badge) => `<button class="${(S.view===v || (v==='areas'&&S.view==='area'))?'on':''}" data-act="go" data-v="${v}">${ic}${badge?`<span class="badge">${badge}</span>`:''}${label}</button>`;
  $('#nav').innerHTML = b('today', I.today, 'Сегодня', over) + b('areas', I.areas, 'Полки') +
    `<button class="fab" data-act="new" aria-label="Новая задача">${I.plus}</button>` +
    b('inbox', I.inbox, 'Входящие', inboxN) + b('plan', I.plan, 'План');
}

function render(){
  const focusSearch = document.activeElement && document.activeElement.id === 'search';
  const pos = focusSearch ? document.activeElement.selectionStart : 0;
  const views = { today: viewToday, areas: viewAreas, area: viewArea, inbox: viewInbox, plan: viewPlan };
  $('#app').innerHTML = (views[S.view] || viewToday)();
  renderNav();
  if (focusSearch){ const s = $('#search'); if (s){ s.focus(); s.setSelectionRange(pos, pos); } }
}

function go(v){
  S.view = v; S.q = '';
  LS.set('tc_view', v === 'area' ? 'area:' + S.areaId : v);
  render(); window.scrollTo(0, 0);
}

// ================= sheet / modal / toast =================
let sheetMode = null;
function openSheet(html, mode){
  sheetMode = mode;
  $('#sheet-in').innerHTML = '<div class="grab"></div>' + html;
  $('#sheet').classList.add('show'); $('#backdrop').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  $('#sheet').classList.remove('show'); $('#backdrop').classList.remove('show');
  document.body.style.overflow = ''; sheetMode = null;
}
let tt;
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(tt); tt = setTimeout(() => t.className = 'toast', err ? 3500 : 1600);
}
function confirmBox(text, okLabel = 'Удалить'){
  return new Promise(res => {
    $('#modal-in').innerHTML = `<p>${text}</p><div class="row"><button class="btn" id="m-no">Отмена</button><button class="btn pri" id="m-yes" style="${okLabel==='Удалить'?'background:var(--red)':''}">${okLabel}</button></div>`;
    $('#modal').classList.add('show');
    const done = v => { $('#modal').classList.remove('show'); res(v); };
    $('#m-no').onclick = () => done(false); $('#m-yes').onclick = () => done(true);
  });
}

let ed = null;
function openEditor(task, defaults = {}){
  ed = task ? { ...task, _id: task.id } : { title: '', notes: '', area_id: null, priority: 2, due: null, status: 'todo', ...defaults };
  drawEditor(); setTimeout(() => { const i = $('#ed-title'); if (i && !task) i.focus(); }, 260);
}
function syncEd(){ const t = $('#ed-title'), n = $('#ed-notes'); if (t) ed.title = t.value; if (n) ed.notes = n.value; }
function areaOptions(selected, excludeId){
  const bad = excludeId ? new Set(areaTree(excludeId)) : new Set();
  return flatAreas().filter(({ a }) => !bad.has(a.id))
    .map(({ a, depth }) => `<option value="${esc(a.id)}" ${a.id === selected ? 'selected' : ''}>${'    '.repeat(depth)}${esc(a.emoji)} ${esc(a.name)}</option>`).join('');
}
function drawEditor(){
  const td = today();
  const dueChoices = [['Сегодня', td], ['Завтра', addDays(td,1)], ['Через неделю', addDays(td,7)], ['Без срока', null]];
  const customDue = ed.due && !dueChoices.some(c => c[1] === ed.due);
  const pk = (on, act, v, label) => `<button class="pick ${on?'on':''}" data-act="${act}" data-v="${v ?? ''}">${label}</button>`;
  const par = ed.parent_id ? taskOf(ed.parent_id) : null;
  const subs = ed._id ? sortTasks(subsOf(ed._id)) : [];
  openSheet(`
    <h2>${ed._id ? (par ? 'Подзадача' : 'Задача') : (par ? 'Новая подзадача' : 'Новая задача')}</h2>
    ${par ? `<div class="parent-link" data-act="ed-open" data-v="${esc(par.id)}">↳ внутри «${esc(par.title)}» — открыть</div>` : ''}
    <input class="fld big" id="ed-title" placeholder="Что нужно сделать?" value="${esc(ed.title)}" autocomplete="off" enterkeyhint="done">
    <textarea class="fld" id="ed-notes" placeholder="Заметка, детали, контакты…">${esc(ed.notes)}</textarea>
    ${ed._id ? `<div class="lbl">Подзадачи${subs.length ? ` · ${subs.filter(x => x.status === 'done').length}/${subs.length}` : ''}</div>
    <div>${subs.map(c => { const n = subsOf(c.id).length; return `<div class="subrow ${c.status==='done'?'done':''}">
        <button class="chk" data-act="ed-sub-toggle" data-v="${esc(c.id)}"></button>
        <span class="t" data-act="ed-open" data-v="${esc(c.id)}">${esc(c.title)}</span>${n ? `<span class="n">☰ ${n}</span>` : ''}</div>`; }).join('')}</div>
    <form class="quick" data-form="sub" style="margin:8px 0 4px"><input id="ed-sub" placeholder="＋ Подзадача" autocomplete="off" enterkeyhint="done"><button type="submit">+</button></form>` : ''}
    <div class="lbl">Полка</div>
    <select class="fld" id="ed-area"><option value="">📥 Входящие</option>${areaOptions(ed.area_id)}</select>
    <div class="lbl">Срок</div>
    <div class="picks">${dueChoices.map(([l, v]) => pk(ed.due === v, 'ed-due', v, l)).join('')}
      <label class="pick ${customDue?'on':''}">📅 <input type="date" id="ed-date" value="${customDue ? ed.due : ''}"></label></div>
    <div class="lbl">Приоритет</div>
    <div class="picks">${[1,2,3].map(p => pk(ed.priority === p, 'ed-prio', p, PRIO[p])).join('')}</div>
    <div class="lbl">Статус</div>
    <div class="picks">${Object.entries(STATUS).map(([k, l]) => pk(ed.status === k, 'ed-status', k, l)).join('')}</div>
    <div class="row">
      ${ed._id ? `<button class="btn danger" data-act="ed-del">Удалить</button>` : `<button class="btn" data-act="close">Отмена</button>`}
      <button class="btn pri" data-act="ed-save">Сохранить</button>
    </div>`, 'editor');
  $('#ed-date').addEventListener('change', e => { syncEd(); ed.due = e.target.value || null; drawEditorKeep(); });
  $('#ed-area').addEventListener('change', e => { ed.area_id = e.target.value || null; });
  $('#ed-title').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); saveEditor(); } });
}
function drawEditorKeep(){ const sc = $('#sheet-in').scrollTop; drawEditor(); $('#sheet-in').scrollTop = sc; }
async function saveEditor(keepOpen){
  syncEd();
  const title = ed.title.trim();
  if (!title){ if (keepOpen) return true; toast('Напиши, что нужно сделать', true); $('#ed-title').focus(); return false; }
  const data = { title, notes: ed.notes.trim(), area_id: ed.area_id || null, priority: ed.priority, due: ed.due || null, status: ed.status };
  const id = ed._id;
  if (!keepOpen) closeSheet();
  if (id){
    const old = taskOf(id); if (!old) return true;
    const p = {}; for (const k in data) if ((old[k] ?? null) !== (data[k] ?? null)) p[k] = data[k];
    if (Object.keys(p).length) await patchTask(id, p, keepOpen ? null : 'Сохранено');
  } else {
    if (ed.parent_id) data.parent_id = ed.parent_id;
    await createTask(data);
  }
  return true;
}
async function editorOpen(id){
  await saveEditor(true);
  const t = taskOf(id); if (t) openEditor(t);
}
async function editorAddSub(){
  const inp = $('#ed-sub'); const title = inp.value.trim(); if (!title) return;
  syncEd(); const pid = ed._id;
  await createTask({ title, parent_id: pid, area_id: ed.area_id || null });
  S.expanded.add(pid); LS.set('tc_exp', [...S.expanded]);
  if (ed && ed._id === pid){ drawEditorKeep(); const i = $('#ed-sub'); if (i) i.focus(); }
}

    <div class="row">
      ${area ? `<button class="btn danger" data-act="ae-del" data-v="${esc(area.id)}">Удалить</button>` : `<button class="btn" data-act="close">Отмена</button>`}
      <button class="btn pri" data-act="ae-save" data-v="${area ? esc(area.id) : ''}">Сохранить</button>
    </div>`, 'area');
  setTimeout(() => { const i = $('#ae-name'); if (i && !area) i.focus(); }, 260);
  $('#ae-name').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); saveArea(area ? area.id : ''); } });
}
async function saveArea(id){
  const name = $('#ae-name').value.trim(), emoji = $('#ae-em').value.trim() || '📁', color = $('#ae-color').value, parent_id = $('#ae-parent').value || null;
  if (!name){ toast('Напиши название полки', true); return; }
  closeSheet();
  if (id){
    const a = areaOf(id); if (!a) return;
    const p = {}; if (a.name !== name) p.name = name; if (a.emoji !== emoji) p.emoji = emoji; if (a.color !== color) p.color = color;
    if ((a.parent_id||null) !== parent_id) p.parent_id = parent_id;
    if (!Object.keys(p).length) return;
    await act(() => Object.assign(a, p), () => api().updateArea(id, p), 'Полка сохранена');
    cacheSave();
  } else {
    const tmp = { id: 'tmp-' + uid(), name, emoji, color, parent_id, sort: 999 };
    const r = await act(() => S.areas.push(tmp), () => api().addArea({ name, emoji, color, parent_id }), 'Полка создана');
    if (r){ const i = S.areas.indexOf(tmp); if (i >= 0) S.areas[i] = r; cacheSave(); render(); }
  }
}
async function deleteArea(id){
  const ar = areaOf(id); if (!ar) return;
  if (!await confirmBox(`Удалить полку «${esc(ar.name)}»? Её задачи и полки переедут уровнем выше.`)) return;
  closeSheet();
  const par = ar.parent_id || null;
  await act(() => { S.areas.forEach(x => { if (x.parent_id === id) x.parent_id = par; }); S.tasks.forEach(t => { if (t.area_id === id) t.area_id = par; }); S.areas = S.areas.filter(x => x.id !== id); },
            () => api().deleteArea(id), 'Полка удалена');
  cacheSave();
  if (S.view === 'area' && S.areaId === id){ if (par){ S.areaId = par; go('area'); } else go('areas'); }
}

async function connectCloud(){
  const url = ($('#s-url')?.value.trim() || CLOUD.url).replace(/\/+$/, '').replace(/\/rest\/v1$/, '');
  const anon = $('#s-anon')?.value.trim() || CLOUD.anon, key = ($('#s-key') || $('#w-key')).value.trim();
  if (!/^https?:\/\//.test(url) || !anon || !key){ toast('Введи ключ приложения', true); return; }
  const c = { url, anon, key };
  toast('Проверяю подключение…');
  try{ await rpc('tm_list', { p_done_days: 0 }, c); }
  catch(e){ toast('Не подключилось: ' + e.message, true); return; }
  const wasLocal = !cfg;
  const local = Local.load();
  cfg = c; LS.set('tc_cfg', cfg);
  closeSheet(); await reload();
  toast('Облако подключено ✓');
  if (wasLocal && local.tasks.length){
    const ok = await confirmBox(`На этом устройстве есть ${local.tasks.length} ${plural(local.tasks.length,'задача','задачи','задач')}. Перенести их в облако?`, 'Перенести');
    if (ok) await migrate(local);
  }
}
function byDepth(list, key){
  const ids = new Map(list.map(x => [x.id, x])); const d = x => { let n = 0, p = x; while (p && p[key] && ids.has(p[key]) && n < 30){ p = ids.get(p[key]); n++; } return n; };
  return list.slice().sort((a, b) => d(a) - d(b));
}
async function migrate(src){
  toast('Переношу…');
  try{
    const amap = {}, tmap = {};
    for (const a of byDepth(src.areas, 'parent_id')){
      const par = a.parent_id ? (amap[a.parent_id] || null) : null;
      const same = S.areas.find(x => x.name.toLowerCase() === String(a.name).toLowerCase() && (x.parent_id||null) === par);
      if (same){ amap[a.id] = same.id; continue; }
      const n = await Cloud.addArea({ ...a, parent_id: par }); amap[a.id] = n.id; S.areas.push(n);
    }
    let n = 0;
    for (const t of byDepth(src.tasks, 'parent_id')){
      const r = await Cloud.addTask({ ...t, area_id: t.area_id ? (amap[t.area_id] || null) : null, parent_id: t.parent_id ? (tmap[t.parent_id] || null) : null });
      tmap[t.id] = r.id; n++;
    }
    await reload(true); toast(`Перенесено: ${n}`);
    return true;
  }catch(e){ toast('Ошибка переноса: ' + e.message, true); await reload(true); return false; }
}

async function disconnect(){
  if (!await confirmBox('Отключить облако? Задачи в облаке останутся, приложение вернётся к локальным данным этого устройства.', 'Отключить')) return;

function exportJson(){
  const data = JSON.stringify({ app: 'task-center', exported: new Date().toISOString(), areas: S.areas, tasks: S.tasks }, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = `tasks-${today()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importJson(file){
  try{
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.tasks) || !Array.isArray(d.areas)) throw new Error('не тот формат');
    if (!await confirmBox(`Добавить ${d.tasks.length} ${plural(d.tasks.length,'задачу','задачи','задач')} из файла к текущим?`, 'Добавить')) return;
    if (cfg){ closeSheet(); await migrate(d); }
    else{
      const db = Local.load(); const map = {}, tmap = {};
      for (const a of byDepth(d.areas, 'parent_id')){
        const par = a.parent_id ? (map[a.parent_id] || null) : null;
        const same = db.areas.find(x => x.name.toLowerCase() === String(a.name).toLowerCase() && (x.parent_id||null) === par);
        if (same){ map[a.id] = same.id; continue; }
        const id = uid(); db.areas.push({ ...a, id, parent_id: par }); map[a.id] = id;
      }
      for (const t of byDepth(d.tasks, 'parent_id')){ const id = uid(); tmap[t.id] = id;
        db.tasks.push({ ...t, id, area_id: t.area_id ? (map[t.area_id] || null) : null, parent_id: t.parent_id ? (tmap[t.parent_id] || null) : null }); }
      Local.save(db); closeSheet(); await reload(); toast('Импортировано');
    }
  }catch(e){ toast('Не удалось прочитать файл: ' + e.message, true); }
}

// ================= ChatGPT setup =================
function gptSchema(){
  const KEY = { type: 'string', enum: [cfg.key], description: 'Ключ приложения. Всегда передавай ровно это значение.' };
  const ok = { '200': { description: 'OK', content: { 'application/json': { schema: { type: 'object' } } } } };
  const op = (id, summary, props, req, consequential = false) => ({ post: {
    operationId: id, summary, 'x-openai-isConsequential': consequential,
    requestBody: { required: true, content: { 'application/json': { schema: { type: 'object', required: ['p_key', ...req], properties: { p_key: KEY, ...props } } } } },
    responses: ok } });
  const area = { type: 'string', description: 'Полка: путь через / (например "EV77 / Авито"), название или id. Не указывай — задача попадёт во «Входящие» (у подзадачи — на полку родителя).' };
  const parent = { type: 'string', format: 'uuid', description: 'id родительской задачи — тогда это подзадача' };
  const parentArea = { type: 'string', description: 'Родительская полка: путь, название или id. Пусто — верхний уровень.' };
  const prio = { type: 'integer', enum: [1,2,3], description: '1 — высокий/срочно, 2 — обычный, 3 — низкий' };
  const due = { type: 'string', format: 'date', description: 'Срок в формате ГГГГ-ММ-ДД' };
  const status = { type: 'string', enum: ['todo','doing','waiting','done'], description: 'todo — сделать, doing — в работе, waiting — ждёт кого-то, done — готово' };
  return {
    openapi: '3.1.0',
    info: { title: 'Центр задач', version: '1.0.0', description: 'Личный центр задач: полки (направления) и задачи.' },
    servers: [{ url: cfg.url + '/rest/v1' }],
    paths: {
      '/rpc/tm_list': op('listTasks', 'Все полки и задачи (открытые + выполненные за p_done_days дней) и сегодняшняя дата today (Москва)',
        { p_done_days: { type: 'integer', default: 7 } }, []),
      '/rpc/tm_add_task': op('addTask', 'Добавить задачу',
        { p_title: { type: 'string' }, p_notes: { type: 'string' }, p_area: area, p_priority: prio, p_due: due, p_status: status, p_parent: parent }, ['p_title']),
      '/rpc/tm_update_task': op('updateTask', 'Изменить задачу. Передавай только то, что меняется.',
        { p_id: { type: 'string', format: 'uuid' }, p_title: { type: 'string' }, p_notes: { type: 'string' }, p_area: area, p_priority: prio, p_due: due, p_status: status,
          p_clear_due: { type: 'boolean', description: 'true — убрать срок' }, p_clear_area: { type: 'boolean', description: 'true — переложить во «Входящие»' },
          p_parent: { ...parent, description: 'Сделать подзадачей этой задачи' }, p_clear_parent: { type: 'boolean', description: 'true — вынести на верхний уровень' } }, ['p_id']),
      '/rpc/tm_delete_task': op('deleteTask', 'Удалить задачу навсегда', { p_id: { type: 'string', format: 'uuid' } }, ['p_id'], true),
      '/rpc/tm_add_area': op('addArea', 'Создать полку (в т.ч. внутри другой полки через p_parent)', { p_name: { type: 'string' }, p_emoji: { type: 'string' }, p_color: { type: 'string', description: 'HEX цвет, например #6c8cff' }, p_parent: parentArea }, ['p_name']),
      '/rpc/tm_update_area': op('updateArea', 'Переименовать, изменить или переместить полку', { p_id: { type: 'string', format: 'uuid' }, p_name: { type: 'string' }, p_emoji: { type: 'string' }, p_color: { type: 'string' }, p_sort: { type: 'integer' }, p_parent: parentArea, p_clear_parent: { type: 'boolean', description: 'true — сделать полкой верхнего уровня' } }, ['p_id']),
      '/rpc/tm_delete_area': op('deleteArea', 'Удалить полку (её задачи и подполки переедут уровнем выше)', { p_id: { type: 'string', format: 'uuid' } }, ['p_id'], true)
    }
  };
}
const GPT_INSTRUCTIONS = `Ты — помощник по личному Центру задач Дениса. Отвечай по-русски, коротко и по делу.

Как работать с задачами:
- Перед любым ответом о задачах или изменением сначала вызови listTasks — так ты узнаешь актуальные id, полки и сегодняшнюю дату (поле today, время московское).
- Даты передавай в формате ГГГГ-ММ-ДД. «Завтра», «в пятницу», «через неделю» считай от today.
- Полки бывают вложенными (у каждой полки в listTasks есть path, например "EV77 / Авито"). В p_area передавай path. Если непонятно, куда положить, — не указывай полку: задача попадёт во «Входящие».
- Подзадачи: у задачи есть parent_id. Чтобы добавить подзадачу — addTask с p_parent = id родителя (полку можно не указывать, возьмётся у родителя). Вложенность любая: у подзадач бывают свои подзадачи.
- Если я прошу «разбей задачу на шаги» — создай подзадачи.
- Новая полка внутри другой — addArea с p_parent (путь родителя).
- Приоритет: 1 — срочно/важно, 2 — обычный (по умолчанию), 3 — низкий.
- Статусы: todo — сделать, doing — в работе, waiting — ждёт кого-то/чего-то, done — готово.
- «Сделал», «закрой», «готово» → updateTask с p_status="done".
- Убрать срок → p_clear_due=true. Переложить во «Входящие» → p_clear_area=true.
- Если я диктую несколько задач сразу — добавь каждую отдельным вызовом addTask. Длинные детали клади в p_notes, а название делай коротким.
- Удаляй только по прямой просьбе. Если сомневаешься — лучше отметь выполненной.
- Если полки нет — спроси, создать ли новую (addArea).

Как отвечать:
- После изменений — одна-две строки: что сделал.
- На «что на сегодня?», «что горит?» — покажи просроченное и задачи на сегодня, сгруппируй по полкам, срочные первыми.
- На «разбери входящие» — предложи, на какие полки и с какими сроками разложить задачи без полки, и после моего «да» сделай.
- На «план на неделю» — задачи на 7 дней вперёд по дням.
- Показывая задачи, выводи подзадачи деревом с отступами и отметкой ✅ у выполненных.`;

function openGpt(){
  const schema = JSON.stringify(gptSchema(), null, 2);
  openSheet(`
    <h2>🤖 Подключить ChatGPT</h2>
    <div class="hint">
      1. ChatGPT → <b>Explore GPTs</b> → <b>Create</b> → вкладка <b>Configure</b>.<br>
      2. Name: <code>Центр задач</code>. В <b>Instructions</b> вставь текст ниже.<br>
      3. Внизу <b>Create new action</b> → в <b>Schema</b> вставь схему.<br>
      4. <b>Authentication</b> → <b>API Key</b> → Auth Type <b>Custom</b> → Custom Header Name: <code>apikey</code>, API Key: твой Publishable/anon key.<br>
      5. Сохрани GPT как <b>Only me</b> (только для меня) — в схеме твой ключ.
    </div>
    <div class="lbl">Instructions</div>
    <pre class="code" id="g-ins">${esc(GPT_INSTRUCTIONS)}</pre>
    <button class="btn" style="width:100%" data-act="copy" data-src="g-ins">Скопировать инструкцию</button>
    <div class="lbl" style="margin-top:16px">Schema</div>
    <pre class="code" id="g-sch">${esc(schema)}</pre>
    <button class="btn" style="width:100%" data-act="copy" data-src="g-sch">Скопировать схему</button>
    <div class="lbl" style="margin-top:16px">API Key (для Authentication)</div>
    <pre class="code" id="g-key">${esc(cfg.anon)}</pre>
    <button class="btn" style="width:100%" data-act="copy" data-src="g-key">Скопировать ключ</button>
    <div class="row"><button class="btn" data-act="settings">← Назад</button></div>
  `, 'gpt');
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); }
  catch{ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch{} ta.remove(); }
  toast('Скопировано');
}

// ================= events =================
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  const tid = el.closest('.task')?.dataset.id;
  switch (a){
    case 'go': go(v); break;
    case 'open-area': S.areaId = v; go('area'); break;
    case 'expand': { if (S.expanded.has(tid)) S.expanded.delete(tid); else S.expanded.add(tid); LS.set('tc_exp', [...S.expanded]); render(); break; }
    case 'edit-area': { const ar = areaOf(v); if (ar) openAreaEditor(ar); break; }
    case 'ae-save': saveArea(v); break;
    case 'ae-del': deleteArea(v); break;
    case 'ed-open': editorOpen(v); break;
    case 'ed-sub-toggle': { syncEd(); toggleDone(v); setTimeout(drawEditorKeep, 0); break; }
    case 'toggle': toggleDone(tid); break;
    case 'edit': { if (e.target.closest('[data-act="expand"]')) break; const t = S.tasks.find(x => x.id === tid); if (t) openEditor(t); break; }
    case 'new': {
      const d = {};
      if (S.view === 'today') d.due = today();
      if (S.view === 'area') d.area_id = S.areaId;
      openEditor(null, d); break;
    }
    case 'refresh': reload(); break;
    case 'settings': openSettings(); break;
    case 'close': closeSheet(); break;
    case 'show-done': S.showDone[el.dataset.k] = !S.showDone[el.dataset.k]; render(); break;
    case 'new-area': openAreaEditor(null, v || null); break;
    // editor
    case 'ed-due': syncEd(); ed.due = v || null; drawEditorKeep(); break;
    case 'ed-prio': syncEd(); ed.priority = Number(v); drawEditorKeep(); break;
    case 'ed-status': syncEd(); ed.status = v; drawEditorKeep(); break;
    case 'ed-save': saveEditor(); break;
    case 'ed-del': { const id = ed._id; const nd = taskDesc(id).length; if (await confirmBox(`Удалить задачу${nd ? ` и ${nd} ${plural(nd,'подзадачу','подзадачи','подзадач')}` : ''} навсегда?`)){ closeSheet(); removeTask(id); } break; }
    // settings
    case 's-connect': connectCloud(); break;
    case 's-disconnect': disconnect(); break;
    case 's-gpt': openGpt(); break;
    case 's-link': shareLink(); break;
    case 'w-skip': LS.set('tc_skip_cloud', true); closeSheet(); break;
    case 's-export': exportJson(); break;
    case 's-import': $('#file-in').click(); break;
    case 'copy': copyText($('#' + el.dataset.src).textContent); break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.closest('[data-form="sub"]')){ e.preventDefault(); editorAddSub(); return; }
  const f = e.target.closest('[data-form="quick"]'); if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'); const title = inp.value.trim(); if (!title) return;
  const t = { title };
  if (S.view === 'area') t.area_id = S.areaId;
  if (title.endsWith('!')){ t.title = title.replace(/!+$/, '').trim(); t.priority = 1; }
  inp.value = '';
  createTask(t).then(() => { const i = document.querySelector('.quick input'); if (i) i.focus(); });
});
document.addEventListener('input', e => { if (e.target.id === 'search'){ S.q = e.target.value; render(); } });
$('#backdrop').addEventListener('click', closeSheet);
$('#file-in').addEventListener('change', e => { const f = e.target.files[0]; if (f) importJson(f); e.target.value = ''; });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if ($('#modal').classList.contains('show')) $('#modal').classList.remove('show'); else closeSheet(); } });

// свайп вниз закрывает шторку
(() => { let y0 = null; const s = $('#sheet-in');
  s.addEventListener('touchstart', e => { y0 = s.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  s.addEventListener('touchend', e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 90) closeSheet(); y0 = null; }, { passive: true });
})();

// автообновление: при возврате в приложение и раз в минуту (чтобы видеть правки ChatGPT)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && cfg && !sheetMode) reload(true); });
setInterval(() => { if (document.visibilityState === 'visible' && cfg && !sheetMode) reload(true); }, 60000);
let lastDay = today();
setInterval(() => { if (today() !== lastDay){ lastDay = today(); render(); } }, 30000);

// ================= start =================
if (cfg){ const c = LS.get('tc_cache', null); if (c){ S.areas = c.areas || []; S.tasks = c.tasks || []; } }
render();
reload(true);
if (!cfg && !LS.get('tc_skip_cloud', false)) setTimeout(openWelcome, 300);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
