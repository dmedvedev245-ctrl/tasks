<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Центр задач</title>
<meta name="theme-color" content="#0e1422">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Задачи">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0e1422; --surface:#161e30; --surface2:#1d2740; --line:#26314d;
  --text:#e7ecf5; --muted:#8a96ad; --faint:#6b7791;
  --accent:#6c8cff; --red:#ff6b6b; --amber:#f5b84c; --green:#4cc38a; --violet:#a78bfa;
  --p1:#ff8080; --p2:#8fa6ff; --p3:#a3adc2;
  --p1-bg:rgba(255,107,107,.13); --p2-bg:rgba(108,140,255,.15); --p3-bg:rgba(163,173,194,.13);
  --red-bg:rgba(255,107,107,.12); --amber-bg:rgba(245,184,76,.12); --accent-bg:rgba(108,140,255,.14); --violet-bg:rgba(167,139,250,.14); --green-bg:rgba(76,195,138,.12);
  --nav-bg:rgba(14,20,34,.94); --toast:#2b3756; --toast-err:#6a2a38; --toast-text:#f2f5fb; --on-accent:#fff; --tick:#0e1422;
  --r:14px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f2f4f9; --surface:#ffffff; --surface2:#e9edf5; --line:#d6dce8;
  --text:#141a2a; --muted:#525c70; --faint:#6e778b;
  --accent:#3550cf; --red:#c22b2b; --amber:#8f5200; --green:#1f7a35; --violet:#6a3dbd;
  --p1:#c22b2b; --p2:#3550cf; --p3:#566074;
  --p1-bg:rgba(194,43,43,.09); --p2-bg:rgba(53,80,207,.09); --p3-bg:rgba(86,96,116,.10);
  --red-bg:rgba(194,43,43,.09); --amber-bg:rgba(143,82,0,.10); --accent-bg:rgba(53,80,207,.09); --violet-bg:rgba(106,61,189,.09); --green-bg:rgba(31,122,53,.10);
  --nav-bg:rgba(255,255,255,.94); --toast:#1d2438; --toast-err:#9e2433; --toast-text:#ffffff; --on-accent:#fff; --tick:#fff;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f4f9; --surface:#ffffff; --surface2:#e9edf5; --line:#d6dce8;
  --text:#141a2a; --muted:#525c70; --faint:#6e778b;
  --accent:#3550cf; --red:#c22b2b; --amber:#8f5200; --green:#1f7a35; --violet:#6a3dbd;
  --p1:#c22b2b; --p2:#3550cf; --p3:#566074;
  --p1-bg:rgba(194,43,43,.09); --p2-bg:rgba(53,80,207,.09); --p3-bg:rgba(86,96,116,.10);
  --red-bg:rgba(194,43,43,.09); --amber-bg:rgba(143,82,0,.10); --accent-bg:rgba(53,80,207,.09); --violet-bg:rgba(106,61,189,.09); --green-bg:rgba(31,122,53,.10);
  --nav-bg:rgba(255,255,255,.94); --toast:#1d2438; --toast-err:#9e2433; --toast-text:#ffffff; --on-accent:#fff; --tick:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{min-height:100dvh;overscroll-behavior-y:contain}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:760px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 110px)}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hdr h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .sub{font-size:13px;color:var(--muted);font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--muted);font-size:18px}
.icon-btn:active{background:var(--surface2)}
.icon-btn svg{width:20px;height:20px}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;margin-right:6px;vertical-align:middle}
.sync-dot.on{background:var(--green)} .sync-dot.err{background:var(--red)} .sync-dot.wait{background:var(--amber)}
.banner{display:flex;align-items:center;gap:10px;background:var(--amber-bg);border:1px solid var(--amber);color:var(--amber);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:600}
.banner span{flex:1;min-width:0}
.banner button{padding:8px 12px;border-radius:10px;background:var(--surface2);color:var(--text);font-size:13px;font-weight:700;min-height:36px}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sec .n{background:var(--surface2);color:var(--muted);border-radius:20px;padding:1px 8px;font-size:12px;letter-spacing:0}
.sec.red{color:var(--red)} .sec.amber{color:var(--amber)} .sec.accent{color:var(--accent)} .sec.green{color:var(--green)}
.sec .toggle{margin-left:auto;font-size:13px;text-transform:none;letter-spacing:0;color:var(--accent);padding:8px 4px;min-height:36px}
.list{display:flex;flex-direction:column;gap:6px}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:6px 0 10px}
.empty{text-align:center;color:var(--muted);padding:28px 16px;background:var(--surface);border-radius:var(--r);font-size:15px;line-height:1.5}
.empty b{display:block;font-size:26px;margin-bottom:6px}
.empty .btn{margin-top:14px;width:100%}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--surface2);color:var(--muted);display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.red{color:var(--red);background:var(--red-bg)}
.chip.amber{color:var(--amber);background:var(--amber-bg)}
.chip.accent{color:var(--accent);background:var(--accent-bg)}
.chip.violet{color:var(--violet);background:var(--violet-bg)}
.chip.green{color:var(--green);background:var(--green-bg)}
.chip.btnchip{cursor:pointer;color:var(--accent);background:var(--accent-bg);padding:6px 10px}
.chip.pend{color:var(--amber);background:var(--amber-bg)}
.chip.pr{border:1px solid currentColor;background:none;padding:2px 8px}
.chip.pr i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.chip.pr.p1{color:var(--p1);background:var(--p1-bg)} .chip.pr.p2{color:var(--p2);background:var(--p2-bg)} .chip.pr.p3{color:var(--p3);background:var(--p3-bg)}
.pt{font-weight:700} .pt.p1{color:var(--p1)} .pt.p2{color:var(--p2)} .pt.p3{color:var(--p3)}
.pt i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;margin-right:4px;vertical-align:1px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.pcard{background:var(--surface);border-radius:16px;padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pcard.main{border-color:var(--accent)}
.pcard.left{border-color:var(--amber-bg);border-left:3px solid var(--amber)}
.pcard .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pcard .top:empty{display:none}
.slot{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.pcard .ttl{font-size:17px;font-weight:700;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.pcard.main .ttl{font-size:19px}
.pline{font-size:14px;line-height:1.45;color:var(--text);overflow-wrap:anywhere}
.pline .k{color:var(--muted);font-weight:600}
.pline.muted{color:var(--muted)}
.linkbtn{color:var(--accent);font-size:13px;font-weight:600;padding:6px 0;text-align:left;min-height:32px}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.prog .bar{flex:1;height:5px;border-radius:5px;background:var(--surface2);overflow:hidden;max-width:140px}
.prog .bar i{display:block;height:100%;background:var(--green)}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.act{min-height:50px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 2px}
.act b{font-size:17px;line-height:1;color:var(--text)}
.act.go b{color:var(--accent)} .act.ok b{color:var(--green)} .act.wt b{color:var(--amber)}
.act:active{background:var(--line)}
.slot-empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px 14px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5;width:100%}
.slot-empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.addslot{width:100%;min-height:50px;border-radius:14px;border:1.5px dashed var(--line);color:var(--accent);font-weight:700;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted);font-weight:600;min-height:44px;display:flex;align-items:center;gap:6px}
.stat b{color:var(--text);font-size:15px}
.stat.red b{color:var(--red)}
.task{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border-radius:var(--r);padding:10px 8px;border-left:3px solid transparent;min-height:52px}
.task.p1{border-left-color:var(--p1)} .task.p2{border-left-color:var(--p2)} .task.p3{border-left-color:var(--p3)}
.task.done{opacity:.55} .task.done .ttl{text-decoration:line-through;color:var(--muted)}
.chk{width:40px;height:40px;flex:none;display:grid;place-items:center;margin:-4px 0}
.chk i{width:24px;height:24px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center}
.task.p1 .chk i{border-color:var(--p1)}
.task.done .chk i,.subrow.done .chk i{background:var(--green);border-color:var(--green)}
.task.done .chk i::after,.subrow.done .chk i::after{content:"";width:6px;height:11px;border:solid var(--tick);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tbody{flex:1;min-width:0;cursor:pointer;padding-top:2px}
.task .ttl{font-weight:600;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.task .note{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.task.child{position:relative}
.task.child::before{content:"";position:absolute;left:-12px;top:0;bottom:50%;width:10px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-bottom-left-radius:8px}
.rowmenu{width:40px;height:40px;flex:none;border-radius:10px;color:var(--muted);font-size:20px;margin:-4px 0 0}
.rowmenu:active{background:var(--surface2)}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;outline:none;margin-bottom:10px;min-height:48px}
.search:focus{border-color:var(--accent)}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
@media (min-width:640px){.filters{grid-template-columns:repeat(4,1fr)}}
.filters select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;min-height:44px;min-width:0}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px!important}
.counter{font-size:13px;color:var(--muted);font-weight:600;margin:6px 0 10px}
.more{width:100%;min-height:46px;border-radius:12px;background:var(--surface);color:var(--accent);font-weight:700;margin-top:8px}
.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.areas{grid-template-columns:repeat(3,1fr)}}
.area{background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;min-height:104px}
.area::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.area .em{font-size:22px}
.area .nm{font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.area .cnt{font-size:12px;color:var(--muted);margin-top:auto;line-height:1.4}
.area .cnt .r,.subarea .cnt .r{color:var(--red);font-weight:700}
.subareas{display:flex;flex-direction:column;gap:6px}
.subarea{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r);padding:12px 14px;text-align:left;border-left:3px solid var(--c);min-height:52px}
.subarea .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subarea .cnt{font-size:12px;color:var(--muted);white-space:nowrap}
.subarea.add{border-left-color:var(--line);color:var(--accent);justify-content:center;font-weight:700;font-size:14px}
.wnav{display:flex;gap:8px;margin-bottom:6px}
.wnav button{min-height:44px;padding:0 16px;border-radius:12px;background:var(--surface);font-weight:700;color:var(--muted)}
.wnav .cur{flex:1;color:var(--text)}
.day{background:var(--surface);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.day.today{border:1px solid var(--accent)}
.day.past{opacity:.75}
.day h4{margin:2px 0 6px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.day h4 small{color:var(--muted);font-weight:600}
.day h4 .tag{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.wrow{display:flex;align-items:center;gap:8px;min-height:48px;border-top:1px solid var(--line);padding:4px 0}
.day h4 + .wrow{border-top:0}
.wrow .t{flex:1;min-width:0;cursor:pointer;line-height:1.35}
.wrow .t .x{font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrow .t .s{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .star{color:var(--accent);flex:none;width:18px;text-align:center;font-weight:800}
.wrow.dl .star{color:var(--amber)}
.wrow.over .t .s,.wrow.over .star{color:var(--red)}
.wempty{font-size:13px;color:var(--faint);padding:6px 0}
.wgrp{display:flex;align-items:center;gap:8px;width:100%;min-height:50px;padding:8px 6px;border-top:1px solid var(--line);text-align:left;font-weight:700;font-size:15px;border-radius:10px}
.day h4 + .wgrp,.gbox .wgrp{border-top:0}
.wgrp:active,.wgrp:hover{background:var(--surface2)}
.wgrp .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wgrp .cnt{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.wgrp .cnt .r{color:var(--red)}
.wgrp .chev{color:var(--muted);width:18px;text-align:center;flex:none}
.gin{margin:0 0 6px 10px;padding-left:8px;border-left:2px solid var(--line)}
.gin .wrow:first-child{border-top:0}
.gbox{background:var(--surface);border-radius:16px;padding:4px 8px;margin-bottom:8px}
.gbox .list{margin:0 0 8px}
.gbox .task{background:var(--bg)}
.wsub{flex:none;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-bg);border-radius:14px;padding:6px 10px;min-height:34px}
.wrow.sub{padding-left:18px}
.wrow.sub .chk{margin:-6px 0}
.wrow.sub.done .x{text-decoration:line-through;color:var(--muted)}
.wrow.sub.done .chk i{background:var(--green);border-color:var(--green)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px 6px calc(var(--sb) + 4px);z-index:10}
.nav-in{max-width:760px;margin:0 auto;display:flex}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint);padding:8px 0;position:relative;min-height:56px;white-space:nowrap}
@media (max-width:380px){.nav button{font-size:10px;letter-spacing:-.01em}}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:#c92a2a;color:#fff;font-size:10px;border-radius:10px;padding:0 5px;line-height:16px;min-width:16px}
.nav .badge.amber{background:#8f5200}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(var(--sb) + 80px);width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 24px rgba(60,90,220,.35);z-index:11}
.fab svg{width:26px;height:26px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;justify-content:center;pointer-events:none}
.sheet.show{transform:none;pointer-events:auto}
.sheet-in{background:var(--surface);width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:10px 18px calc(var(--sb) + 18px);overflow-y:auto;max-height:92dvh}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 12px;font-size:20px;font-weight:800;overflow-wrap:anywhere;padding-right:52px}
.sheet-top{position:sticky;top:0;height:0;z-index:5;display:flex;justify-content:flex-end}
.sheet-x{width:44px;height:44px;border-radius:12px;background:var(--surface2);color:var(--text);font-size:20px;line-height:1;display:grid;place-items:center;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.18);margin-right:-4px}
.sheet-x:active,.sheet-x:hover{background:var(--line)}
.sheet h3{margin:20px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fld{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;min-height:46px;margin-bottom:10px}
.fld:focus{border-color:var(--accent)}
textarea.fld{min-height:70px;resize:vertical;line-height:1.45}
.fld.big{font-size:18px;font-weight:600;min-height:60px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.lbl small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint)}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pick{min-height:42px;padding:8px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pick.on{background:var(--accent-bg);border-color:var(--accent);color:var(--text)}
.pick .pdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.pick input[type=date]{width:135px} .pick input[type=time]{width:92px}
:root[data-theme="dark"] input::-webkit-calendar-picker-indicator{filter:invert(.7)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) input::-webkit-calendar-picker-indicator{filter:invert(.7)} }

<script>
'use strict';
// ================= утилиты =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
const plural = (n, a, b, c) => { const m10 = n%10, m100 = n%100; return m10===1&&m100!==11 ? a : (m10>=2&&m10<=4&&(m100<10||m100>=20) ? b : c); };
// Даты — всегда по Москве, формат ГГГГ-ММ-ДД
const TZ = 'Europe/Moscow';
const fmtISO = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const today = () => fmtISO.format(new Date());
const isoOf = ts => ts ? fmtISO.format(new Date(ts)) : null;
const toUTC = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d); };
const fromUTC = ms => new Date(ms).toISOString().slice(0, 10);
const addDays = (s, n) => fromUTC(toUTC(s) + n * 864e5);
const diffDays = (a, b) => Math.round((toUTC(a) - toUTC(b)) / 864e5);
const wday = s => new Date(toUTC(s)).getUTCDay();
const weekStart = s => addDays(s, -((wday(s) + 6) % 7));
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const WDF = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const dm = s => { const d = new Date(toUTC(s)); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
function fmtDay(s){
  const n = diffDays(s, today());
  if (n === 0) return 'сегодня';
  if (n === 1) return 'завтра';
  if (n === -1) return 'вчера';
  return (n > 1 && n < 7 ? WD[wday(s)] + ', ' : '') + dm(s);
}
const STATUS = { todo:'Не начата', doing:'В работе', waiting:'Ждёт', done:'Готово' };
const STATUS_CHIP = { todo:'', doing:'violet', waiting:'amber', done:'green' };
const PRIO = { 1:'Высокий', 2:'Обычный', 3:'Отложенный' };
const DEFAULT_AREAS = [['Store 457','🏪','#6c8cff'], ['Kynne&Tech','📱','#a78bfa'], ['EV77','🚗','#4cc38a'], ['DioNis','🎵','#f5b84c'], ['Личное','🏠','#ff8a8a']];
const TEXT_FIELDS = ['next_step', 'done_criteria', 'wait_for', 'unblock_action'];
const prioChip = p => { p = p || 2; return `<span class="chip pr p${p}" title="Приоритет"><i></i>${PRIO[p]}</span>`; };
const prioText = p => { p = p || 2; return `<span class="pt p${p}"><i></i>${PRIO[p]}</span>`; };
// Заявки на аренду: статусы плана (фактическое состояние машин ведёт Mini App)
const RSTATUS = { inquiry: 'Новое обращение', negotiation: 'Согласование', confirmed: 'Бронь подтверждена', issued: 'Автомобиль выдан', completed: 'Завершено', cancelled: 'Отменено' };
const RSTATUS_IC = { inquiry: '✉', negotiation: '💬', confirmed: '✔', issued: '🚗', completed: '✓', cancelled: '✕' };
const RACTIVE = ['inquiry', 'negotiation', 'confirmed', 'issued'];
const STEPS = [['clarify', 'Уточнить даты и условия с клиентом'], ['contract', 'Подготовить договор'], ['place_time', 'Согласовать место и время'],
  ['assignee', 'Назначить исполнителя'], ['prepare_car', 'Подготовить автомобиль'], ['payment', 'Проверить оплату и залог'],
  ['handover', 'Провести выдачу'], ['return', 'Запланировать возврат']];
const RENTAL_TEXT = ['car', 'car_color', 'car_plate', 'client_name', 'client_phone', 'location', 'notes', 'source', 'external_id'];
const RENTAL_DT = ['start_date', 'start_time', 'end_date', 'end_time'];
const customKey = title => 'custom:' + String(title).trim().toLowerCase().replace(/\s+/g, ' ');

// Оформление: как в системе / светлая / тёмная
function applyTheme(v){
  LS.set('tc_theme', v);
  if (v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme');
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0e1422';
}
applyTheme(LS.get('tc_theme', 'auto'));

// ================= состояние =================
let cfg = LS.get('tc_cfg', null);
const CLOUD = { url: 'https://sjxhgnssuqimehpyiflm.supabase.co', anon: 'sb_publishable_CX0K45yuIk6o0UkuLYYgBg_jMqtuA-k' };
(() => {
  const m = location.hash.match(/key=([0-9a-f]{32})/i);
  if (m){ cfg = { ...CLOUD, key: m[1].toLowerCase() }; LS.set('tc_cfg', cfg); history.replaceState(null, '', location.pathname); }
})();
const VIEWS = ['today', 'week', 'waiting', 'rentals', 'list', 'areas', 'area'];
const S = {
  view: 'today', areaId: null, areas: [], tasks: [], rentals: [], loaded: false,
  rf: { car: '', status: 'active' }, gopen: {},
  loading: false, syncErr: null, netDown: false,
  open: { rest: false, overdue: false, donetoday: false, noplan: false },
  expanded: new Set(LS.get('tc_exp', [])),
  weekOff: 0,
  f: { q: '', area: '', status: 'open', prio: '', due: '' }, listLimit: 60,
  pick: { q: '', area: '', subs: false }
};
let outbox = LS.get('tc_outbox', []);

const areaOf = id => S.areas.find(a => a.id === id);
const taskOf = id => S.tasks.find(t => t.id === id);
const kidsOf = id => S.areas.filter(a => (a.parent_id || null) === (id || null)).sort((a, b) => (a.sort||0) - (b.sort||0) || a.name.localeCompare(b.name));
function areaTree(id){ const out = [id]; for (const c of kidsOf(id)) out.push(...areaTree(c.id)); return out; }
function areaChain(id){ const p = []; let a = areaOf(id), g = 0; while (a && g++ < 20){ p.unshift(a); a = areaOf(a.parent_id); } return p; }
const areaPath = id => areaChain(id).map(a => a.name).join(' / ');
function flatAreas(parent = null, depth = 0){ return kidsOf(parent).flatMap(a => [{ a, depth }, ...flatAreas(a.id, depth + 1)]); }
const subsOf = id => S.tasks.filter(t => t.parent_id === id);
function descOf(id){ const out = []; for (const c of subsOf(id)) out.push(c, ...descOf(c.id)); return out; }
const isTop = t => !t.parent_id || !taskOf(t.parent_id);
const isOpen = t => t.status !== 'done';
const isOverdue = t => isOpen(t) && t.due && t.due < today();
const openDesc = id => descOf(id).filter(isOpen).length;
const pendingIds = () => new Set(outbox.map(o => o.op.id || (o.op.task && o.op.task.id) || (o.op.rental && o.op.rental.id)).filter(Boolean));
const rentalOf = id => S.rentals.find(r => r.id === id);
const rentalTasks = id => S.tasks.filter(t => t.rental_id === id);
const hm = v => v ? String(v).slice(0, 5) : null;
const carLabel = r => [r.car, r.car_color, r.car_plate].filter(Boolean).join(' · ');
const normRental = r => ({ ...r, start_time: hm(r.start_time), end_time: hm(r.end_time) });
const byWork = (a, b) => (a.status === 'done') - (b.status === 'done') || (b.status === 'doing') - (a.status === 'doing') ||
  (a.priority||2) - (b.priority||2) || ((a.due||'9999') < (b.due||'9999') ? -1 : (a.due||'9999') > (b.due||'9999') ? 1 : 0) ||
  String(a.created_at||'').localeCompare(String(b.created_at||''));
const sortTasks = arr => arr.slice().sort(byWork);

// ================= операции: одна логика для экрана, локального режима и сервера =================
// addTask{task} | updateTask{id,patch,subtasks?} | deleteTask{id} | planDay{date,main,next} | addArea{area} | updateArea{id,patch} | deleteArea{id}
function applyOp(st, op){
  const T = st.tasks, A = st.areas, now = new Date().toISOString();
  const find = id => T.find(t => t.id === id);
  const desc = id => { const out = []; const walk = p => T.forEach(t => { if (t.parent_id === p){ out.push(t); walk(t.id); } }); walk(id); return out; };
  switch (op.type){
    case 'addStep':
      if (op.task.template_step && T.some(t => t.rental_id === op.task.rental_id && t.template_step === op.task.template_step)) return;
      // fallthrough — шаг подготовки это обычная задача
    case 'addTask': {
      if (find(op.task.id)) return;
      const par = op.task.parent_id ? find(op.task.parent_id) : null;
      T.push({ notes: '', status: 'todo', priority: 2, due: null, plan_date: null, plan_order: null, next_step: null, done_criteria: null,
        wait_for: null, unblock_action: null, check_date: null, rental_id: null, template_step: null, created_at: now, updated_at: now, done_at: null, ...op.task,
        area_id: op.task.area_id || (par ? par.area_id : null), parent_id: op.task.parent_id || null });
      const t = find(op.task.id); if (t.status === 'done') t.done_at = now;
      TEXT_FIELDS.forEach(k => { if (!t[k]) t[k] = null; });
      return;
    }
    case 'updateTask': {
      const t = find(op.id); if (!t) return;
      const p = op.patch;
      if (p.status === 'done' && t.status !== 'done' && op.subtasks === 'close') desc(t.id).forEach(d => { if (d.status !== 'done'){ d.status = 'done'; d.done_at = now; } });
      if ('plan_date' in p && !('plan_order' in p) && p.plan_date !== t.plan_date) t.plan_order = null;
      Object.assign(t, p, { updated_at: now });
      TEXT_FIELDS.forEach(k => { if (k in p && !p[k]) t[k] = null; });
      t.done_at = t.status === 'done' ? (t.done_at || now) : null;
      return;
    }
    case 'deleteTask': { const kill = new Set([op.id, ...desc(op.id).map(x => x.id)]); st.tasks = T.filter(t => !kill.has(t.id)); return; }
    case 'planDay': {
      const ids = [op.main, ...(op.next || [])].filter(Boolean);
      T.forEach(t => { if (t.plan_date === op.date && t.plan_order != null && !ids.includes(t.id)) t.plan_order = null; });
      if (op.main){ const m = find(op.main); if (m){ m.plan_date = op.date; m.plan_order = 0; } }
      (op.next || []).forEach((id, i) => { if (id === op.main) return; const x = find(id); if (x){ x.plan_date = op.date; x.plan_order = i + 1; } });
      return;
    }
    case 'linkTask': { const t = find(op.id); if (!t) return; if (t.rental_id !== (op.rental_id || null)) t.template_step = null; t.rental_id = op.rental_id || null; t.updated_at = now; return; }
    case 'addRental': {
      if (!st.rentals) st.rentals = [];
      if (st.rentals.find(r => r.id === op.rental.id)) return;
      st.rentals.push({ car_color: null, car_plate: null, client_name: null, client_phone: null, start_date: null, start_time: null, end_date: null, end_time: null,
        status: 'inquiry', location: null, notes: '', source: null, external_id: null, created_at: now, updated_at: now, ...op.rental });
      return;
    }
    case 'updateRental': {
      const r = (st.rentals || []).find(x => x.id === op.id); if (!r) return;
      Object.assign(r, op.patch, { updated_at: now });
      if (!r.start_date) r.start_time = null; if (!r.end_date) r.end_time = null;
      return;
    }
    case 'deleteRental': {
      T.forEach(t => { if (t.rental_id === op.id){ t.rental_id = null; t.template_step = null; } });
      st.rentals = (st.rentals || []).filter(r => r.id !== op.id); return;
    }
    case 'addArea': {
      if (A.find(a => a.id === op.area.id)) return;
      const par = op.area.parent_id ? A.find(a => a.id === op.area.parent_id) : null;
      A.push({ emoji: '📁', sort: 999, ...op.area, color: op.area.color || (par ? par.color : '#6c8cff'), parent_id: op.area.parent_id || null });
      return;
    }
    case 'updateArea': { const a = A.find(x => x.id === op.id); if (a) Object.assign(a, op.patch); return; }
    case 'deleteArea': {
      const a = A.find(x => x.id === op.id); const par = a ? (a.parent_id || null) : null;
      A.forEach(x => { if (x.parent_id === op.id) x.parent_id = par; }); T.forEach(t => { if (t.area_id === op.id) t.area_id = par; });
      st.areas = A.filter(x => x.id !== op.id); return;
    }
  }
}

// ---------- локальный режим (без облака) ----------
const Local = {
  load(){
    let db = LS.get('tc_local', null);
    if (!db){ db = { areas: DEFAULT_AREAS.map(([name, emoji, color], i) => ({ id: uid(), name, emoji, color, sort: i + 1, parent_id: null })), tasks: [], rentals: [] }; LS.set('tc_local', db); }
    if (!db.rentals) db.rentals = [];
    return db;
  },
  async list(){ return { ...this.load(), today: today() }; },
  async send(op){ const db = this.load(); applyOp(db, JSON.parse(JSON.stringify(op))); LS.set('tc_local', db); }
};

// ---------- облако ----------
class NetError extends Error {}
async function rpc(fn, args, c = cfg){
  const headers = { apikey: c.anon, 'Content-Type': 'application/json' };
  if (c.anon.startsWith('eyJ')) headers.Authorization = 'Bearer ' + c.anon;
  let r;
  try { r = await fetch(c.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers, body: JSON.stringify({ p_key: c.key, ...args }) }); }
  catch (e){ throw new NetError('Нет связи с сервером'); }
  const j = await r.json().catch(() => null);
  if (r.status >= 500 || r.status === 429) throw new NetError((j && j.message) || ('Сервер недоступен (' + r.status + ')'));
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || ('Ошибка ' + r.status));
  return j;
}
function taskParams(p){
  const a = {};
  if ('title' in p) a.p_title = p.title;
  if ('notes' in p) a.p_notes = p.notes || '';
  if ('priority' in p) a.p_priority = p.priority;
  if ('status' in p) a.p_status = p.status;
  if ('due' in p){ if (p.due) a.p_due = p.due; else a.p_clear_due = true; }
  if ('area_id' in p){ if (p.area_id) a.p_area = p.area_id; else a.p_clear_area = true; }
  if ('parent_id' in p){ if (p.parent_id) a.p_parent = p.parent_id; else a.p_clear_parent = true; }
  if ('plan_date' in p){ if (p.plan_date) a.p_plan_date = p.plan_date; else a.p_clear_plan_date = true; }
  if ('plan_order' in p){ if (p.plan_order != null) a.p_plan_order = p.plan_order; else a.p_clear_plan_order = true; }
  if ('check_date' in p){ if (p.check_date) a.p_check_date = p.check_date; else a.p_clear_check_date = true; }
  TEXT_FIELDS.forEach(k => { if (k in p) a['p_' + k] = p[k] || ''; });
  return a;
}
const Cloud = {
  async list(){ return rpc('tm_list', { p_done_days: 3650 }); },
  async send(op){
    switch (op.type){
      case 'addTask': { const t = op.task; return rpc('tm_add_task', { p_id: t.id, p_title: t.title, p_notes: t.notes || '', p_area: t.area_id || null, p_priority: t.priority || 2,
        p_due: t.due || null, p_status: t.status || 'todo', p_parent: t.parent_id || null, p_plan_date: t.plan_date || null, p_plan_order: t.plan_order ?? null,
        p_next_step: t.next_step || null, p_done_criteria: t.done_criteria || null, p_wait_for: t.wait_for || null, p_unblock_action: t.unblock_action || null, p_check_date: t.check_date || null }); }
      case 'updateTask': return rpc('tm_update_task', { p_id: op.id, ...taskParams(op.patch), ...(op.subtasks ? { p_subtasks: op.subtasks } : {}) });
      case 'deleteTask': return rpc('tm_delete_task', { p_id: op.id });
      case 'planDay': return rpc('tm_plan_day', { p_date: op.date, p_main: op.main || null, p_next: op.next || [] });
      case 'addArea': { const a = op.area; return rpc('tm_add_area', { p_id: a.id, p_name: a.name, p_emoji: a.emoji || '📁', p_color: a.color || null, p_parent: a.parent_id || null }); }
      case 'updateArea': { const p = op.patch, a = { p_id: op.id, p_name: p.name ?? null, p_emoji: p.emoji ?? null, p_color: p.color ?? null };
        if ('parent_id' in p){ if (p.parent_id) a.p_parent = p.parent_id; else a.p_clear_parent = true; } return rpc('tm_update_area', a); }
      case 'deleteArea': return rpc('tm_delete_area', { p_id: op.id });
      case 'addStep': { const t = op.task; return rpc('tm_add_rental_step', { p_rental: t.rental_id, p_title: t.title, p_step: t.template_step || null, p_id: t.id,
        p_area: t.area_id || null, p_priority: t.priority || 2, p_plan_date: t.plan_date || null, p_due: t.due || null }); }
      case 'linkTask': return rpc('tm_link_task', { p_task: op.id, p_rental: op.rental_id || null });
      case 'addRental': { const r = op.rental, a = { p_id: r.id, p_car: r.car };
        for (const k of RENTAL_TEXT.concat(RENTAL_DT, ['status'])) if (k !== 'car' && r[k] != null && r[k] !== '') a['p_' + k] = r[k];
        return rpc('tm_add_rental', a); }
      case 'updateRental': { const a = { p_id: op.id }, clear = [];
        for (const [k, v] of Object.entries(op.patch)){
          if (RENTAL_DT.includes(k)){ if (v) a['p_' + k] = v; else clear.push(k); }
          else a['p_' + k] = v == null ? '' : v;
        }
        if (clear.length) a.p_clear = clear;
        return rpc('tm_update_rental', a); }
      case 'deleteRental': return rpc('tm_delete_rental', { p_id: op.id });
    }
  }
};
const api = () => (cfg ? Cloud : Local);

// ---------- очередь отправки: сразу на экране, на сервер по порядку, повтор без дублей ----------
let flushing = false, retryTimer = null;
function saveOutbox(){ LS.set('tc_outbox', outbox); }
async function commit(op, confirmMsg){
  applyOp(S, op);
  if (!cfg){ await Local.send(op); render(); if (confirmMsg) toast(confirmMsg); return; }
  outbox.push({ opId: uid(), op, confirm: confirmMsg || null });
  saveOutbox(); render(); flush();
}
async function flush(){
  if (flushing || !cfg) return;
  flushing = true;
  let hadError = false;
  try {
    while (outbox.length){
      const item = outbox[0];
      try { await Cloud.send(item.op); }
      catch (e){
        if (e instanceof NetError){
          if (!S.netDown) toast('Нет связи — изменения сохранены на устройстве и отправятся позже', true);
          S.netDown = true; render();
          clearTimeout(retryTimer); retryTimer = setTimeout(flush, 20000);
          return;
        }
        outbox.shift(); saveOutbox();
        toast('Не сохранено: ' + e.message, true); hadError = true;
        continue;
      }
      outbox.shift(); saveOutbox();
      if (S.netDown){ S.netDown = false; toast('Связь восстановлена — изменения отправлены'); }
      else if (item.confirm) toast(item.confirm);
      render();
    }
  } finally { flushing = false; }
  if (hadError) reload(true);
}
window.addEventListener('online', () => flush());

async function reload(silent){
  S.loading = true; if (!silent) render();
  try {
    const d = await api().list();
    S.areas = d.areas || []; S.tasks = d.tasks || []; S.rentals = (d.rentals || []).map(normRental);
    for (const it of outbox) applyOp(S, JSON.parse(JSON.stringify(it.op)));
    S.syncErr = null; S.loaded = true;
    if (cfg) LS.set('tc_cache', { areas: S.areas, tasks: S.tasks, rentals: S.rentals });
  } catch (e){
    S.syncErr = e.message;
    if (!silent) toast('Не удалось обновить: ' + e.message, true);
  } finally { S.loading = false; render(); }
}

// ---------- действия ----------
const upd = (id, patch, msg, extra = {}) => commit({ type: 'updateTask', id, patch, ...extra }, msg);
function planOf(date){
  const P = S.tasks.filter(t => isOpen(t) && t.plan_date === date);
  const main = P.find(t => t.plan_order === 0) || null;
  const next = P.filter(t => t.plan_order === 1 || t.plan_order === 2).sort((a, b) => a.plan_order - b.plan_order);
  const rest = sortTasks(P.filter(t => t !== main && !next.includes(t)));
  return { all: P, main, next, rest };
}
function setSlot(id, date, slot, msg){
  const t = taskOf(id); if (!t) return false;
  const p = planOf(date);
  let main = p.main ? p.main.id : null, next = p.next.map(x => x.id).filter(x => x !== id);
  if (main === id) main = null;
  if (slot === 'main'){ if (main) next.unshift(main); main = id; }
  else if (slot === 'next'){ if (next.length >= 2){ toast('Следующих уже две — сначала уберите одну из них', true); return false; } next.push(id); }
  else {
    if (t.plan_date !== date){ upd(id, { plan_date: date, plan_order: null }, msg || 'Добавлено в план дня'); return true; }
    if (t.plan_order == null) return true;
  }
  commit({ type: 'planDay', date, main, next: next.slice(0, 2) }, msg || (slot === 'main' ? 'Главная задача дня выбрана' : 'План дня обновлён'));
  return true;
}
async function askSubtasks(n){
  return choose(`У задачи ${n} ${plural(n, 'открытая подзадача', 'открытые подзадачи', 'открытых подзадач')}. Что с ними сделать?`, [
    ['close', '✓', 'Закрыть вместе с подзадачами', `отметить выполненными все ${n}`],
    ['keep', '◻', 'Закрыть только задачу', 'подзадачи останутся открытыми'],
  ]);
}
async function finishTask(id){
  const t = taskOf(id); if (!t) return;
  if (t.status === 'done'){ upd(id, { status: 'todo' }, 'Задача снова открыта'); return; }
  const r = t.rental_id ? rentalOf(t.rental_id) : null;
  const msg = t.template_step === 'handover' && r && r.status !== 'issued'
    ? 'Шаг закрыт. Статус заявки не изменён — отметьте выдачу в заявке, когда она подтвердится' : 'Готово ✓';
  const n = openDesc(id);
  if (!n){ upd(id, { status: 'done' }, msg); return; }
  const ch = await askSubtasks(n);
  if (ch) upd(id, { status: 'done' }, msg, { subtasks: ch });
}
// «Взять сегодня»: только день работы. Главной не делаем; есть место в «Дальше» — туда, иначе в «Ещё на сегодня».
function takeToday(id){
  const td = today(), p = planOf(td);
  if (p.next.length < 2) setSlot(id, td, 'next', 'Взято на сегодня — в «Дальше»');
  else { S.open.rest = true; setSlot(id, td, 'rest', 'Взято на сегодня — в «Ещё на сегодня»'); }
}

function taskRow(t, opts = {}, depth = 0){
  const subs = subsOf(t.id);
  const chips = [];
  if (subs.length && !opts.flat){
    const dn = subs.filter(x => x.status === 'done').length;
    chips.push(`<span class="chip btnchip" data-act="expand">${S.expanded.has(t.id) ? '▾' : '▸'} ${dn}/${subs.length} ${plural(subs.length, 'подзадача', 'подзадачи', 'подзадач')}</span>`);
  } else if (subs.length) chips.push(`<span class="chip">☰ ${subs.filter(x => x.status === 'done').length}/${subs.length}</span>`);
  if ((opts.flat || opts.showParent) && depth === 0 && t.parent_id && taskOf(t.parent_id)) chips.push(`<span class="chip">↳ ${esc(taskOf(t.parent_id).title)}</span>`);
  if (!opts.hideArea && depth === 0) chips.push(areaChip(t.area_id));
  if (t.status !== 'done') chips.push(statusChip(t));
  chips.push(dueChip(t));
  if (t.plan_date && isOpen(t)) chips.push(`<span class="chip accent">📌 ${t.plan_order === 0 ? 'главная · ' : ''}${fmtDay(t.plan_date)}</span>`);
  if (isOpen(t)) chips.push(prioChip(t.priority));
  chips.push(rentalChip(t));
  if (pendingIds().has(t.id)) chips.push('<span class="chip pend">⟳</span>');
  let h = `<div class="task p${t.priority||2} ${t.status === 'done' ? 'done' : ''} ${depth ? 'child' : ''}" data-id="${esc(t.id)}" style="${depth ? `margin-left:${Math.min(depth, 4) * 18}px` : ''}">
    <button class="chk" data-act="finish" aria-label="Отметить выполненной"><i></i></button>
    <div class="tbody" data-act="edit"><div class="ttl">${esc(t.title)}</div>
      ${t.next_step && isOpen(t) ? `<div class="note">→ ${esc(t.next_step)}</div>` : ''}
      <div class="meta">${chips.join('')}</div></div>
    <button class="rowmenu" data-act="move" aria-label="Запланировать">⋯</button>
  </div>`;
  if (subs.length && !opts.flat && S.expanded.has(t.id))
    h += sortTasks(subs).map(c => taskRow(c, { ...opts, hideArea: true }, depth + 1)).join('');
  return h;
}

function weekRow(t, kind, inGroup){
  const par = t.parent_id ? taskOf(t.parent_id) : null;
  const sub = [];
  if (kind === 'dl') sub.push('срок');
  if (kind === 'over') sub.push('срок был ' + dm(t.due));
  if (kind === 'due') sub.push(fmtDay(t.due));
  if (!inGroup) sub.push(areaPath(t.area_id) || 'Входящие');
  if (kind === 'plan' && t.due) sub.push('срок ' + fmtDay(t.due));
  if (kind !== 'plan' && t.plan_date) sub.push('📌 ' + fmtDay(t.plan_date));
  if (par) sub.push('↳ ' + par.title);
  const rr = t.rental_id ? rentalOf(t.rental_id) : null; if (rr) sub.push('🚗 ' + [rr.car, rr.car_plate].filter(Boolean).join(' '));
  const star = kind === 'plan' ? (t.plan_order === 0 ? '★' : t.plan_order ? String(t.plan_order + 1) : '•') : kind === 'over' ? '!' : kind === 'none' ? '·' : '⏰';
  return `<div class="wrow ${kind === 'dl' || kind === 'due' ? 'dl' : ''} ${kind === 'over' ? 'over' : ''}" data-id="${esc(t.id)}">
    <span class="star">${star}</span>
    <div class="t" data-act="edit"><div class="x">${esc(t.title)}</div><div class="s">${prioText(t.priority)} · ${esc(sub.join(' · '))}</div></div>
    ${subsOf(t.id).length ? `<button class="wsub" data-act="wexp" aria-label="Подзадачи">${S.expanded.has(t.id) ? '▾' : '▸'} ${subsOf(t.id).filter(x => x.status === 'done').length}/${subsOf(t.id).length}</button>` : ''}
    <button class="rowmenu" data-act="move" aria-label="Назначить день">⋯</button></div>${S.expanded.has(t.id) ? subRows(t.id) : ''}`;
}
function subRows(pid){
  return sortTasks(subsOf(pid)).map(c => { const n = subsOf(c.id).length;
    return `<div class="wrow sub ${c.status === 'done' ? 'done' : ''}" data-id="${esc(c.id)}">
      <button class="chk" data-act="finish" aria-label="Отметить выполненной"><i></i></button>
      <div class="t" data-act="edit"><div class="x">${esc(c.title)}</div><div class="s">${[c.status !== 'todo' ? STATUS[c.status] : '', c.due ? 'срок ' + fmtDay(c.due) : '', c.plan_date && isOpen(c) ? '📌 ' + fmtDay(c.plan_date) : '', n ? '☰ ' + n : ''].filter(Boolean).join(' · ') || prioText(c.priority)}</div></div></div>`; }).join('');
}
// Блоки по полкам: задачи дня собраны по полкам, блок раскрывается нажатием
function groupByArea(tasks){
  const m = new Map(); for (const t of tasks){ const k = t.area_id && areaOf(t.area_id) ? t.area_id : ''; if (!m.has(k)) m.set(k, []); m.get(k).push(t); }
  return [...m.entries()].sort((a, b) => (a[0] ? 0 : 1) - (b[0] ? 0 : 1) || Math.min(...a[1].map(t => t.plan_order ?? 9)) - Math.min(...b[1].map(t => t.plan_order ?? 9)) || areaPath(a[0]).localeCompare(areaPath(b[0])));
}
const grpOpen = (key, def) => key in S.gopen ? S.gopen[key] : def;
function grpHead(key, aid, items, open, def){
  const a = areaOf(aid), over = items.filter(isOverdue).length, main = items.some(t => t.plan_order === 0 && t.plan_date === today());

}
function viewWeek(){
  const td = today(), ws = addDays(weekStart(td), S.weekOff * 7), we = addDays(ws, 6);
  const open = S.tasks.filter(isOpen);
  let h = header('Неделя', `${dm(ws)} — ${dm(we)}`);
  h += `<div class="wnav"><button data-act="wk" data-v="-1" aria-label="Прошлая неделя">‹</button><button class="cur" data-act="wk" data-v="0">${S.weekOff ? 'К текущей неделе' : 'Текущая неделя'}</button><button data-act="wk" data-v="1" aria-label="Следующая неделя">›</button></div>`;
  const over = sortTasks(open.filter(t => t.due && t.due < td));
  if (over.length){
    h += `<div class="sec red">Срок прошёл<span class="n">${over.length}</span></div><div class="hint">Сроки не переносятся автоматически. Откройте задачу, чтобы изменить срок, или нажмите ⋯ и назначьте день работы.</div>`;
    h += `<div class="day">${over.map(t => weekRow(t, 'over')).join('')}</div>`;
  }
  h += `<div class="sec">По дням</div>`;
  for (let i = 0; i < 7; i++){
    const d = addDays(ws, i);
    const plan = open.filter(t => t.plan_date === d).sort((a, b) => (a.plan_order ?? 99) - (b.plan_order ?? 99) || byWork(a, b));
    const dl = sortTasks(open.filter(t => t.due === d && t.plan_date !== d));
    h += `<div class="day ${d === td ? 'today' : ''} ${d < td ? 'past' : ''}"><h4>${WDF[wday(d)]} <small>${dm(d)}</small>${d === td ? '<span class="tag">сегодня</span>' : ''}</h4>`;
    const rs = S.rentals.filter(r => RACTIVE.includes(r.status) && (r.start_date === d || r.end_date === d));

    h += gs.map(([aid, ts]) => { const key = d + '|' + aid, def = gs.length === 1, op = grpOpen(key, def);
      return grpHead(key, aid, ts, op, def) + (op ? `<div class="gin">${ts.map(t => weekRow(t, kind.get(t), true)).join('')}</div>` : ''); }).join('') + rs.map(r => { const out = r.start_date === d;
      return `<div class="wrow" data-act="open-rental" data-v="${esc(r.id)}" style="cursor:pointer"><span class="star">🚗</span><div class="t"><div class="x">${out ? 'Выдача' : 'Возврат'}: ${esc(carLabel(r))}</div><div class="s">${out ? (r.start_time || 'время не уточнено') : (r.end_time || 'время не уточнено')} · ${RSTATUS[r.status]}${r.client_name ? ' · ' + esc(r.client_name) : ''}</div></div></div>`; }).join('');
    if (!plan.length && !dl.length && !rs.length) h += `<div class="wempty">Ничего не запланировано</div>`;
    h += `</div>`;
  }
  const upcoming = open.filter(t => t.due && t.due >= td && t.due <= addDays(td, 13)).sort((a, b) => a.due < b.due ? -1 : a.due > b.due ? 1 : byWork(a, b));
  h += `<div class="sec">Ближайшие сроки · 14 дней<span class="n">${upcoming.length}</span></div>`;
  h += upcoming.length ? `<div class="day">${upcoming.map(t => weekRow(t, 'due')).join('')}</div>` : `<div class="hint">В ближайшие две недели сроков нет.</div>`;
  const noplan = sortTasks(open.filter(t => isTop(t) && !t.due && !t.plan_date));
  h += `<div class="sec">Без срока и без дня работы<span class="n">${noplan.length}</span><button class="toggle" data-act="tg" data-k="noplan">${S.open.noplan ? 'свернуть' : 'показать'}</button></div>`;
  if (S.open.noplan) h += `<div class="hint">Эти задачи ещё нужно запланировать: нажмите ⋯ и выберите день.</div><div class="day">${noplan.slice(0, S.listLimit).map(t => weekRow(t, 'none')).join('')}</div>` +
    (noplan.length > S.listLimit ? `<button class="more" data-act="more">Показать ещё (${noplan.length - S.listLimit})</button>` : '');
  return h;
}

function matchDue(t, f, td){
  if (!f) return true;
  if (f === 'over') return !!t.due && t.due < td && isOpen(t);
  if (f === 'today') return t.due === td;
  if (f === 'week') return !!t.due && t.due >= td && t.due <= addDays(td, 6);
  if (f === 'has') return !!t.due;
  if (f === 'none') return !t.due;
  return true;
}
function viewList(){
  const f = S.f, td = today();
  const areaSet = f.area && f.area !== 'inbox' ? new Set(areaTree(f.area)) : null;
  const passStatus = t => f.status === 'all' ? true : f.status === 'open' ? isOpen(t) : t.status === f.status;
  const pass = t => passStatus(t) && (!f.prio || String(t.priority) === f.prio) && matchDue(t, f.due, td) &&
    (f.area === 'inbox' ? !t.area_id : !areaSet || areaSet.has(t.area_id));

  let res, flat;
  if (q){ flat = true; res = sortTasks(S.tasks.filter(t => pass(t) && (t.title + ' ' + (t.notes || '') + ' ' + (t.next_step || '')).toLowerCase().includes(q))); }
  else { flat = false; res = sortTasks(S.tasks.filter(t => isTop(t) && pass(t))); }
  let h = header('Задачи', counts(S.tasks.filter(isOpen)) + ' открыто');
  h += `<input class="search" id="search" type="search" placeholder="🔍 Поиск по названиям и заметкам" value="${esc(f.q)}" autocomplete="off">`;

    <select id="f-status" aria-label="Статус">${[['open','Открытые'],['todo','Не начаты'],['doing','В работе'],['waiting','Ждут'],['done','Выполненные'],['all','Все, с выполненными']].map(([v, l]) => `<option value="${v}" ${f.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select>

  return h;

const rStatusChip = r => `<span class="chip st-${r.status}">${RSTATUS_IC[r.status] || ''} ${RSTATUS[r.status] || r.status}</span>`;
const rWhen = (d, t) => d ? `${fmtDay(d)}${t ? ', ' + t : ''}` : '';

const FIELDS = ['title', 'notes', 'area_id', 'priority', 'due', 'status', 'plan_date', 'next_step', 'done_criteria', 'wait_for', 'unblock_action', 'check_date'];
const norm = (k, v) => (TEXT_FIELDS.includes(k) || k === 'notes') ? (v || '') : (v ?? null);
async function saveEditor(keepOpen){
  syncEd();
  const title = (ed.title || '').trim();
  if (!title){ if (keepOpen) return true; toast('Напишите, что нужно сделать', true); $('#ed-title').focus(); return false; }
  const data = { title, notes: (ed.notes || '').trim(), area_id: ed.area_id || null, priority: ed.priority, due: ed.due || null, status: ed.status,
    plan_date: ed.plan_date || null, next_step: (ed.next_step || '').trim(), done_criteria: (ed.done_criteria || '').trim(),
    wait_for: (ed.wait_for || '').trim(), unblock_action: (ed.unblock_action || '').trim(), check_date: ed.check_date || null };
  const slot = data.plan_date ? ed._slot : 'rest';
  if (!ed._id){
    if (!keepOpen) closeSheet();
    await commit({ type: 'addTask', task: { id: ed.id, parent_id: ed.parent_id || null, ...data, plan_order: null } }, keepOpen ? null : 'Задача создана');
    if (ed.rental_id) commit({ type: 'linkTask', id: ed.id, rental_id: ed.rental_id });
    if (data.plan_date && slot !== 'rest') setSlot(ed.id, data.plan_date, slot);
    LS.del('tc_draft');
    return true;
  }
  const id = ed._id, old = taskOf(id); if (!old){ closeSheet(); return true; }
  const p = {};
  for (const k of FIELDS) if (norm(k, old[k]) !== norm(k, data[k])) p[k] = data[k];
  const extra = {};
  if (p.status === 'done' && openDesc(id)){
    const ch = await askSubtasks(openDesc(id));
    if (!ch) return false;
    extra.subtasks = ch;
  }
  const linkCh = (old.rental_id || null) !== (ed.rental_id || null);
  if (!keepOpen) closeSheet();
  if (Object.keys(p).length) await commit({ type: 'updateTask', id, patch: p, ...extra }, keepOpen ? null : 'Сохранено');
  if (linkCh) commit({ type: 'linkTask', id, rental_id: ed.rental_id || null }, keepOpen || Object.keys(p).length ? null : 'Связь с заявкой сохранена');
  if (keepOpen){ ed = { ...taskOf(id), _id: id, _slot: ed._slot }; edBase = edSnap(); LS.del('tc_draft'); }
  const cur = taskOf(id);
  if (data.plan_date && slot !== slotOf(cur)) setSlot(id, data.plan_date, slot);
  else if (!Object.keys(p).length && !linkCh && !keepOpen) toast('Без изменений');
  return true;
}

  if (r.start_date && addDays(r.start_date, -1) > addDays(td, 1)) plans.push(['За день до выдачи', addDays(r.start_date, -1)]);
  openSheet(`<h2>Шаги подготовки</h2>
    <div class="hint">${esc(carLabel(r))}${r.start_date ? ' · выдача ' + fmtDay(r.start_date) : ''}. Отметьте нужные шаги — каждый станет обычной задачей и появится в «Сегодня», «Неделе» и «Ожиданиях».</div>
    <div>${STEPS.map(([k, l]) => have.has(k)
      ? `<label class="chkrow dis"><input type="checkbox" checked disabled><span class="t">${l}<small>уже добавлен</small></span></label>`
      : `<label class="chkrow"><input type="checkbox" class="stp" value="${k}"><span class="t">${l}</span></label>`).join('')}</div>
    <div class="lbl">Свои шаги <small>— по одному в строке</small></div>
    <textarea class="fld" id="stp-custom" rows="2" placeholder="Например: заправить, помыть"></textarea>
    <div class="lbl">День работы для новых шагов <small>— необязательно</small></div>
    <div class="picks" id="stp-plan">${plans.map(([l, v]) => `<button class="pick ${v === '' ? 'on' : ''}" data-act="stp-plan" data-v="${v}">${l}${v && l !== 'Сегодня' && l !== 'Завтра' ? ' · ' + dm(v) : ''}</button>`).join('')}</div>
    <div class="lbl">Приоритет</div>
    <div class="picks" id="stp-prio">${[1, 2, 3].map(p => `<button class="pick ${p === 2 ? 'on' : ''}" data-act="stp-prio" data-v="${p}"><span class="pdot" style="background:var(--p${p})"></span>${PRIO[p]}</button>`).join('')}</div>
    <div class="row"><button class="btn" data-act="stp-back" data-v="${esc(rid)}">Назад</button><button class="btn pri" data-act="stp-add" data-v="${esc(rid)}">Добавить выбранные</button></div>`, 'steps:' + rid);
}
function addSteps(rid, keys, custom, reopen){
  const r = rentalOf(rid); if (!r) return 0;
  const ev = S.areas.find(a => !a.parent_id && /^ev\s?77$/i.test(a.name));
  const suffix = ' · ' + [r.car, r.car_plate].filter(Boolean).join(' ');
  const have = new Set(rentalTasks(rid).map(t => t.template_step).filter(Boolean));
  const items = [], seen = new Set();
  for (const [k, title] of keys.map(k => [k, (STEPS.find(x => x[0] === k) || [])[1]]).concat(custom.map(c => [customKey(c), c])))
    if (title && !have.has(k) && !seen.has(k)){ seen.add(k); items.push([k, title]); }
  const skipped = keys.length + custom.length - items.length;
  if (!items.length){ toast(skipped ? 'Эти шаги уже добавлены' : 'Отметьте хотя бы один шаг', true); return 0; }
  items.forEach(([k, title], i) => commit({ type: 'addStep', task: { id: uid(), title: title + suffix, rental_id: rid, template_step: k,
    area_id: ev ? ev.id : null, priority: stepPrio, plan_date: stepPlan || null, due: null } },
    i === items.length - 1 ? `Добавлено шагов: ${items.length}${skipped ? ` · уже были: ${skipped}` : ''}` : null));
  return items.length;
}

// ================= настройки, облако, копии =================
function openSettings(){
  const st = cfg ? `<span class="sync-dot ${S.netDown ? 'wait' : S.syncErr ? 'err' : 'on'}"></span>${S.netDown ? 'Нет связи — изменения ждут отправки' : S.syncErr ? 'Ошибка: ' + esc(S.syncErr) : 'Облако подключено'}` : `<span class="sync-dot"></span>Только на этом устройстве`;
  const c = cfg || {};
  const th = LS.get('tc_theme', 'auto');
  openSheet(`<h2>Настройки</h2><div class="status-box">${st}</div>
    <h3>🎨 Оформление</h3>
    <div class="seg">${[['auto', 'Как в системе'], ['light', 'Светлая'], ['dark', 'Тёмная']].map(([v, l]) => `<button class="pick ${th === v ? 'on' : ''}" data-act="theme" data-v="${v}" style="justify-content:center">${l}</button>`).join('')}</div>
    <h3>☁️ Облако</h3>
    <div class="hint">Задачи общие на всех устройствах и в ChatGPT. Ключ вводится один раз на устройстве.</div>
    <input class="fld" id="s-key" placeholder="Ключ приложения" value="${esc(c.key || '')}" autocomplete="off" autocapitalize="off">
    <details style="margin-bottom:10px"><summary class="hint" style="cursor:pointer">Другой проект Supabase</summary>
      <input class="fld" id="s-url" placeholder="Project URL" value="${esc(c.url || CLOUD.url)}" autocomplete="off" autocapitalize="off">
      <input class="fld" id="s-anon" placeholder="Publishable / anon key" value="${esc(c.anon || CLOUD.anon)}" autocomplete="off" autocapitalize="off"></details>
    <div class="row" style="margin-top:4px">${cfg ? `<button class="btn" data-act="s-disconnect">Отключить</button>` : ''}<button class="btn pri" data-act="s-connect">${cfg ? 'Сохранить' : 'Подключить'}</button></div>
    ${cfg ? `<button class="btn" style="width:100%;margin-top:8px" data-act="s-link">📲 Подключить другое устройство</button>
      <div class="hint">Отправьте ссылку себе и откройте на телефоне — подключится без ввода ключа. Никому её не пересылайте.</div>` : ''}
    <h3>🗂 Полки</h3>
    <div>${flatAreas().map(({ a, depth }) => `<div class="arow" style="margin-left:${depth * 16}px">
      <button class="fld" style="text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" data-act="edit-area" data-v="${esc(a.id)}"><span class="dot" style="background:${esc(a.color)};margin-right:8px"></span>${esc(a.emoji)} ${esc(a.name)}</button>
      <button class="del" data-act="new-area" data-v="${esc(a.id)}" style="color:var(--accent)" aria-label="Полка внутри">＋</button></div>`).join('')}</div>
    <button class="btn" style="width:100%;margin-top:4px" data-act="new-area">＋ Новая полка</button>
    <h3>💾 Резервная копия</h3>
    <div class="row" style="margin-top:0"><button class="btn" data-act="s-export">Скачать JSON</button><button class="btn" data-act="s-import">Загрузить JSON</button></div>
    <div class="hint" style="margin-top:18px;text-align:center;color:var(--faint)">Центр задач · v4.1</div>`, 'settings');
}
async function connectCloud(){
  const url = ($('#s-url')?.value.trim() || CLOUD.url).replace(/\/+$/, '').replace(/\/rest\/v1$/, '');
  const anon = $('#s-anon')?.value.trim() || CLOUD.anon, key = ($('#s-key') || $('#w-key')).value.trim();
  if (!/^https?:\/\//.test(url) || !anon || !key){ toast('Введите ключ приложения', true); return; }
  const c = { url, anon, key };
  toast('Проверяю подключение…');
  try { await rpc('tm_list', { p_done_days: 0 }, c); } catch (e){ toast('Не подключилось: ' + e.message, true); return; }
  const wasLocal = !cfg, local = Local.load();
  cfg = c; LS.set('tc_cfg', cfg); closeSheet(); await reload(); toast('Облако подключено ✓');
  if (wasLocal && local.tasks.length && await confirmBox(`На этом устройстве ${local.tasks.length} ${plural(local.tasks.length, 'запись', 'записи', 'записей')}. Перенести в облако?`, 'Перенести')) importData(local);
}
function byDepth(list){ const ids = new Map(list.map(x => [x.id, x])); const d = x => { let n = 0, p = x; while (p && p.parent_id && ids.has(p.parent_id) && n < 30){ p = ids.get(p.parent_id); n++; } return n; }; return list.slice().sort((a, b) => d(a) - d(b)); }
function importData(src){
  // id сохраняются — повторный импорт того же файла не создаёт дублей
  let n = 0;
  for (const a of byDepth(src.areas || [])) if (!areaOf(a.id)) commit({ type: 'addArea', area: { id: a.id, name: a.name, emoji: a.emoji, color: a.color, parent_id: a.parent_id || null } });
  for (const r of src.rentals || []) if (r && r.id && r.car && !rentalOf(r.id)){ const { tasks_open, tasks_total, next_date, ...rental } = r; commit({ type: 'addRental', rental: normRental(rental) }); n++; }
  for (const t of byDepth(src.tasks || [])) if (!taskOf(t.id)){ const { area, path, rental_id, template_step, ...task } = t; commit({ type: 'addTask', task }); n++;
    if (rental_id && rentalOf(rental_id)) commit({ type: 'linkTask', id: t.id, rental_id }); }
  toast(n ? `Добавлено записей: ${n}` : 'Новых записей нет');
}
async function disconnect(){
  if (!await confirmBox(outbox.length ? `Есть неотправленные изменения (${outbox.length}) — при отключении они пропадут. Отключить?` : 'Отключить облако? Задачи в облаке останутся.', 'Отключить')) return;
  cfg = null; outbox = []; saveOutbox(); LS.del('tc_cfg'); LS.del('tc_cache'); closeSheet(); await reload();
}
function exportJson(){
  const data = JSON.stringify({ app: 'task-center', version: 4, exported: new Date().toISOString(), areas: S.areas, tasks: S.tasks, rentals: S.rentals }, null, 2);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = `tasks-${today()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importJson(file){
  try { const d = JSON.parse(await file.text()); if (!Array.isArray(d.tasks) || !Array.isArray(d.areas)) throw new Error('не тот формат');
    if (await confirmBox(`Добавить из файла записи, которых ещё нет (в файле ${d.tasks.length})?`, 'Добавить')){ closeSheet(); importData(d); } }
  catch (e){ toast('Не удалось прочитать файл: ' + e.message, true); }
}
function openWelcome(){
  openSheet(`<h2>👋 Центр задач</h2><div class="hint">Введите ключ приложения — и задачи станут общими на всех устройствах и в ChatGPT. Это нужно один раз на каждом устройстве.</div>
    <input class="fld" id="w-key" placeholder="Ключ приложения" autocomplete="off" autocapitalize="off">
    <div class="row"><button class="btn" data-act="w-skip">Пока без облака</button><button class="btn pri" data-act="s-connect">Подключить</button></div>`, 'welcome');
}
async function shareLink(){
  const link = location.origin + location.pathname + '#key=' + cfg.key;
  if (navigator.share){ try { await navigator.share({ title: 'Центр задач', url: link }); return; } catch (e){ if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(link); toast('Ссылка скопирована'); } catch { toast('Не удалось скопировать', true); }
}

// ================= события =================
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  const tid = el.closest('[data-id]')?.dataset.id;
  const mv = sheetMode && sheetMode.startsWith('move:') ? sheetMode.slice(5) : null;
  switch (a){
    case 'go': go(v); break;
    case 'open-area': S.areaId = v; go('area'); break;
    case 'inbox': S.f = { q: '', area: 'inbox', status: 'open', prio: '', due: '' }; go('list'); break;
    case 'refresh': if (outbox.length) flush(); else reload(); break;
    case 'retry': flush(); break;
    case 'settings': openSettings(); break;
    case 'close': if (sheetMode === 'editor' || sheetMode === 'rental') requestClose(); else closeSheet(); break;
    case 'sheet-x': requestClose(); break;
    case 'draft-open': { const d = LS.get('tc_draft', null); if (!d) { render(); break; }
      if (d.kind === 'task' && d.ed){ ed = d.ed; edBase = d.base; drawEditor(); } else if (d.kind === 'rental' && d.rd){ rd = d.rd; rdBase = d.base; drawRental(); } break; }
    case 'draft-drop': if (await confirmBox('Удалить несохранённый черновик?')){ LS.del('tc_draft'); render(); } break;
    case 'theme': applyTheme(v); document.querySelectorAll('[data-act="theme"]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); break;
    case 'take': takeToday(tid); break;
    case 'wgrp': { const k = el.dataset.k; S.gopen[k] = !grpOpen(k, el.dataset.def === '1'); render(); break; }
    case 'wexp': { S.expanded.has(tid) ? S.expanded.delete(tid) : S.expanded.add(tid); LS.set('tc_exp', [...S.expanded]); render(); break; }
    case 'new-rental': openRental(null); break;
    case 'open-rental': { if (sheetMode && !(await confirmLeave(true))) break; const r = rentalOf(v); if (r) openRental(r); break; }
    case 'rd-status': syncRd(); rd.status = v; redrawRental(); break;
    case 'rd-save': saveRental(); break;
    case 'rd-del': { const id = rd._id, n = rentalTasks(id).length;
      if (await confirmBox(`Удалить заявку?${n ? ` Связанные задачи (${n}) останутся в центре и будут отвязаны.` : ''}`)){ LS.del('tc_draft'); rdBase = rdSnap(); closeSheet(); commit({ type: 'deleteRental', id }, 'Заявка удалена'); } break; }
    case 'rd-steps': { if (!(await confirmLeave(true))) break; openSteps(rd._id); break; }
    case 'rd-step-toggle': { syncRd(); await finishTask(v); redrawRental(); break; }
    case 'rd-step-open': { if (!(await confirmLeave(true))) break; const t = taskOf(v); if (t) openEditor(t); break; }
    case 'stp-plan': stepPlan = v; document.querySelectorAll('[data-act="stp-plan"]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); break;
    case 'stp-prio': stepPrio = Number(v); document.querySelectorAll('[data-act="stp-prio"]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); break;
    case 'stp-back': { const r = rentalOf(v); closeSheet(); if (r) openRental(r); break; }
    case 'stp-add': { const keys = [...document.querySelectorAll('.stp:checked')].map(x => x.value);
      const custom = ($('#stp-custom').value || '').split('\n').map(x => x.trim()).filter(Boolean);
      if (addSteps(v, keys, custom)){ const r = rentalOf(v); closeSheet(); if (r) openRental(r); } break; }
    case 'rv-apply': applyShift(Number(v)); break;
    case 'tg': S.open[el.dataset.k] = !S.open[el.dataset.k]; render(); break;
    case 'more': S.listLimit += 60; render(); break;
    case 'wk': S.weekOff = v === '0' ? 0 : S.weekOff + Number(v); render(); break;
    case 'freset': S.f = { q: '', area: '', status: 'open', prio: '', due: '' }; render(); break;
    case 'expand': { S.expanded.has(tid) ? S.expanded.delete(tid) : S.expanded.add(tid); LS.set('tc_exp', [...S.expanded]); render(); break; }
    case 'edit': { const t = taskOf(tid); if (t) openEditor(t); break; }
    case 'new': {
      const d = {};
      if (S.view === 'rentals'){ openRental(null); break; }
      if (S.view === 'today') d.plan_date = today();
      if (S.view === 'area') d.area_id = S.areaId;
      if (S.view === 'list' && S.f.area && S.f.area !== 'inbox') d.area_id = S.f.area;
      openEditor(null, d); break;
    }
    case 'start': upd(tid, { status: 'doing' }, 'Задача в работе'); break;
    case 'pause': upd(tid, { status: 'todo' }, 'Поставлено на паузу'); break;
    case 'finish': finishTask(tid); break;
    case 'wait': openWaitSheet(tid); break;
    case 'unwait': upd(tid, { status: 'doing' }, 'Задача снова в работе'); break;
    case 'move': openMoveMenu(tid); break;
    case 'm-day': moveTo(mv, v); break;
    case 'm-slot': if (setSlot(mv, today(), v)) closeSheet(); break;
    case 'm-edit': { closeSheet(); const t = taskOf(mv); if (t) setTimeout(() => openEditor(t), 260); break; }
    case 'pick': openPicker(v); break;
    case 'pk': pickTask(v); break;
    case 'w-d': waitDate = v; $('#w-picks').innerHTML = waitPicks(); bindWaitDate(); break;
    case 'w-save': saveWait(v); break;
    case 'ed-status': syncEd(); ed.status = v; redrawEditor(); break;
    case 'ed-prio': syncEd(); ed.priority = Number(v); redrawEditor(); break;
    case 'ed-date': syncEd(); ed[el.dataset.f] = v || null; redrawEditor(); break;
    case 'ed-save': saveEditor(); break;
    case 'ed-open': editorOpen(v); break;
    case 'ed-sub-toggle': { syncEd(); await finishTask(v); redrawEditor(); break; }
    case 'ed-del': { const id = ed._id, nd = descOf(id).length;
      if (await confirmBox(`Удалить задачу${nd ? ` и ${nd} ${plural(nd, 'подзадачу', 'подзадачи', 'подзадач')}` : ''} навсегда?`)){ closeSheet(); commit({ type: 'deleteTask', id }, 'Удалено'); } break; }
    case 'new-area': openAreaEditor(null, v || null); break;
    case 'edit-area': { const ar = areaOf(v); if (ar) openAreaEditor(ar); break; }
    case 'ae-save': saveArea(v); break;
    case 'ae-del': deleteArea(v); break;
    case 's-connect': connectCloud(); break;
    case 's-disconnect': disconnect(); break;
    case 's-link': shareLink(); break;
    case 's-export': exportJson(); break;
    case 's-import': $('#file-in').click(); break;
    case 'w-skip': LS.set('tc_skip_cloud', true); closeSheet(); break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.closest('[data-form="sub"]')){ e.preventDefault(); editorAddSub(); }
  if (e.target.closest('[data-form="rstep"]')){ e.preventDefault(); const i = $('#rd-step'), title = i.value.trim(); if (!title || !rd || !rd._id) return;
    syncRd(); if (addSteps(rd._id, [], [title])){ i.value = ''; redrawRental(); const n = $('#rd-step'); if (n) n.focus(); } }
});
document.addEventListener('input', e => {
  if (e.target.id === 'search'){ S.f.q = e.target.value; S.listLimit = 60; render(); }
  if (e.target.closest && e.target.closest('#sheet-in')) saveDraft();
});
document.addEventListener('change', e => {
  const m = { 'f-area': 'area', 'f-status': 'status', 'f-prio': 'prio', 'f-due': 'due' }[e.target.id];
  if (m){ S.f[m] = e.target.value; S.listLimit = 60; render(); }
  const rf = { 'rf-car': 'car', 'rf-status': 'status' }[e.target.id];
  if (rf){ S.rf[rf] = e.target.value; render(); }
  if (e.target.closest && e.target.closest('#sheet-in')) saveDraft();
});
$('#backdrop').addEventListener('click', () => requestClose());
$('#file-in').addEventListener('change', e => { const f = e.target.files[0]; if (f) importJson(f); e.target.value = ''; });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ e.preventDefault(); if (modalRes) modalRes(null); else if (sheetMode) requestClose(); } });
window.addEventListener('pagehide', () => saveDraft(true));
let lastDay = today();
const idle = () => document.visibilityState === 'visible' && cfg && !sheetMode && !outbox.length;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden'){ saveDraft(true); return; }
  if (today() !== lastDay){ lastDay = today(); if (!sheetMode) render(); }
  if (outbox.length) flush(); else if (idle()) reload(true);
});
setInterval(() => { if (idle()) reload(true); }, 60000);
setInterval(() => { if (today() !== lastDay){ lastDay = today(); render(); } }, 30000);

// ================= старт =================
(() => {
  S.view = 'today';   // стартовый экран — всегда «Сегодня»
  if (cfg){ const c = LS.get('tc_cache', null); if (c){ S.areas = c.areas || []; S.tasks = c.tasks || []; S.rentals = (c.rentals || []).map(normRental); S.loaded = true; for (const it of outbox) applyOp(S, JSON.parse(JSON.stringify(it.op))); } }
  render();
  reload(true).then(() => flush());
  if (!cfg && !LS.get('tc_skip_cloud', false)) setTimeout(openWelcome, 300);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
